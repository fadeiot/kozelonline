// ---------- Онлайн: гра з друзями через сервер ----------
function guestId() {
  try {
    let id = localStorage.getItem('kozel-guest');
    if (!id) { id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('kozel-guest', id); }
    return id;
  } catch (e) { return 'tmp' + Math.random().toString(36).slice(2, 12); }
}
function netConnect() {
  if (!window.KOZEL_ONLINE) return;
  const N = G.net;
  if (N.ws && N.ws.readyState <= 1) return;
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  N.ws = ws;
  ws.onopen = () => {
    N.retry = 0;
    ws.send(JSON.stringify({ t: 'hello', initData: TG ? TG.initData : '', join: N.join,
      guest: { id: guestId(), name: 'Гість ' + guestId().slice(0, 3).toUpperCase() } }));
    N.join = null;
    // хід, на який не було відповіді до обриву, надсилаємо ще раз (сервер відкине дублікат)
    if (N.pendingAct && Date.now() - N.pendingAct.ts < 30000) N.queue.push(N.pendingAct.msg);
    while (N.queue.length) ws.send(JSON.stringify(N.queue.shift()));
    N.lastPong = Date.now(); netPing();
  };
  ws.onmessage = e => { try { netOnMessage(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  ws.onclose = () => {
    if (N.ws !== ws) return;
    N.ws = null;
    if (N.room) toast('Зв’язок перервано, відновлюємо…');
    setTimeout(netConnect, N.retry++ === 0 ? 150 : Math.min(6000, 600 * N.retry));
  };
}
// Перевірка зв'язку кожні 3 с: мобільний інтернет у Telegram часто «мовчки» обривається —
// якщо сервер не відповів за 7 с, одразу перепідключаємось, а не чекаємо хвилину
function netPing() {
  const ws = G.net.ws;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'ping', ts: Date.now() }));
}
setInterval(() => {
  const N = G.net;
  if (!window.KOZEL_ONLINE || !N.ws) return;
  if (N.ws.readyState === 1 && N.lastPong && Date.now() - N.lastPong > 7000) { N.rtt = null; try { N.ws.close(); } catch (e) {} return; }
  netPing();
  // хід надіслано, а відповіді немає 2,5 с — повторюємо
  if (N.pendingAct && N.sent && Date.now() - N.pendingAct.sentAt > 2500 && N.ws.readyState === 1) {
    N.pendingAct.sentAt = Date.now(); N.ws.send(JSON.stringify(N.pendingAct.msg));
  }
}, 3000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !window.KOZEL_ONLINE) return;
  const N = G.net;
  if (!N.ws || N.ws.readyState > 1) netConnect(); else netPing();
});
function netSend(m) {
  const ws = G.net.ws;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(m));
  else { G.net.queue.push(m); netConnect(); }
}
function netOnMessage(m) {
  if (m.t === 'welcome') {
    G.net.me = m.me; G.net.lastRoom = m.lastRoom || null;
    netSend({ t: 'stats' });
    if (G.net.hallOpen) netSend({ t: 'hall' });
    if (G.sheetKind === 'menu' && !G.net.room) openMenu(G.menuByUser);
    return;
  }
  if (m.t === 'error') {
    G.net.sent = false; G.net.pendingAct = null; toast(m.msg);
    if (G.sheetKind === 'menu' && $('menuErr')) $('menuErr').textContent = m.msg;
    render(); return;
  }
  if (m.t === 'left') {
    G.net.lastRoom = m.lastRoom || null; G.net.away = [];
    Chat.list = []; Chat.unread = 0; chatClose(); chatPaint();
    G.net.room = null; G.deal = null; G.ser = null; G.chips = {}; tgGuard(false); renderPause(null);
    render(); if (G.net.hallOpen) showHall(); else openMenu(); return;
  }
  if (m.t === 'pong') { G.net.lastPong = Date.now(); G.net.rtt = Date.now() - m.ts; return; }
  if (m.t === 'presence') { G.presence = m.list; G.games = m.games || []; if (G.sheetKind === 'hall') showHall(); return; }
  if (m.t === 'invited') { showInvite(m); return; }
  if (m.t === 'inviteDeclined') { toast(`${m.name} зараз не може грати`); return; }
  if (m.t === 'inviteSent') { toast(`Запрошення надіслано: ${m.name}`); return; }
  if (m.t === 'closed') { toast(`${m.by} завершив гру`); haptic.bad(); return; }
  if (m.t === 'ach') { showAch(m.ids); if (G.netStats) m.ids.forEach(id => { G.netStats.me.ach[id] = Date.now(); }); return; }
  if (m.t === 'stats') { G.netStats = m; if (G.sheetKind === 'stats') openStats(G.statsTab); return; }
  if (m.t === 'shareReady') { Share.ready(m); return; }
  if (m.t === 'chatHistory') { Chat.list = m.list; Chat.unread = 0; chatPaint(); return; }
  if (m.t === 'chat') { chatIncoming(m.m); return; }
  if (m.t === 'room') netApply(m);
}
function applyEv(ev, v) {
  if (['attack', 'cover', 'discard', 'intercept'].includes(ev.t)) Sfx.play(ev.t === 'cover' ? 'beat' : ev.t === 'intercept' ? 'intercept' : 'card');
  switch (ev.t) {
    case 'deal': G.chips = { [ev.p]: 'перший' }; break;
    case 'attack': G.chips = { [ev.p]: 'ходить' }; break;
    case 'intercept': G.chips = { [ev.p]: 'перехопив' }; break;
    case 'cover': G.chips[ev.p] = "б'є"; break;
    case 'discard': G.chips[ev.p] = 'скинув'; break;
    case 'collected': G.chips = {}; break;
  }
  if (ev.auto) {
    G.chips[ev.p] = '⏰ час вийшов';
    if (ev.p === 0) { toast('Час на хід вийшов — за вас походив бот'); haptic.bad(); }
  }
  if (v.deal && v.deal.phase === 'resolve') {
    const w = v.deal.winner;
    G.chips = { [w]: 'взятка' };
    if (w === 0 || (v.n === 4 && w === 2)) haptic.good();
    clearTimeout(applyEv.tm);
    applyEv.tm = setTimeout(() => collectTo(w), 850);
  }
}
function netApply(v) {
  const N = G.net;
  if (G.tut) { G.tut = null; Tut.show(); }
  N.room = v; N.names = v.names.map((x, i) => i === 0 ? 'Ви' : x); N.sent = false; N.lastRoom = null; N.pendingAct = null;
  N.offset = (v.now || Date.now()) - Date.now();
  if (v.deadline !== N.deadline) { N.deadline = v.deadline || null; G.warned = false; }
  chatPaint();
  // хто вийшов / повернувся — сповіщаємо всіх
  const was = new Set((N.away || []).map(a => a.name)), now = new Set((v.away || []).map(a => a.name));
  for (const a of v.away || []) if (!was.has(a.name) && notifyOnce('away:' + a.name)) { toast(`Гравець ${a.name} вийшов з гри. Гру зупинено.`); haptic.bad(); }
  for (const nmx of was) if (!now.has(nmx) && v.seats.some(x => x && !x.bot && x.name === nmx) && notifyOnce('back:' + nmx)) toast(`Гравець ${nmx} повернувся до гри`);
  if (now.size !== was.size || [...now].some(x => !was.has(x))) N.pauseHidden = false;
  N.away = v.away || [];

// «Бееее»: короткий синтезований звук, окремий файл не потрібен
const Sfx = {
  ctx: null,
  bleat(delay) {
    if (!G.set.sfx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      this.ctx = this.ctx || new C();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const t = this.ctx.currentTime + (delay || 0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
      const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(185, t + 0.85);
      lfo.type = 'sine'; lfo.frequency.setValueAtTime(21, t); lg.gain.setValueAtTime(38, t);
      lfo.connect(lg); lg.connect(o.frequency);
      f.type = 'bandpass'; f.frequency.setValueAtTime(1150, t); f.Q.setValueAtTime(1.1, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.07);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
      o.connect(f); f.connect(g); g.connect(this.ctx.destination);
      o.start(t); lfo.start(t); o.stop(t + 1); lfo.stop(t + 1);
    } catch (e) {}
  },
};
// Козел (або двоє) з'являється біля того, хто програв
function goatShow(ser, losers, done) {
  const wrap = $('goatWrap');

  const n = ser.n;
  const spot = p => {
    if (p === 0) return [innerWidth / 2, innerHeight * 0.46];
    const el = document.querySelector('#seat' + POS[n][p].at + ' .ava');
    if (!el) return [innerWidth / 2, innerHeight * 0.28];
    const r = el.getBoundingClientRect();
    return [Math.min(Math.max(r.left + r.width / 2, 86), innerWidth - 86), r.top + r.height / 2 + 34];
  };
  const word = losers.length > 1 ? (ser.milk ? 'МОЛОЧНІ КОЗЛИ' : 'КОЗЛИ') : (ser.milk ? 'МОЛОЧНИЙ КОЗЕЛ' : 'КОЗЕЛ');
  const who = losers.map(p => esc(nm(p))).join(' і ');

    return `<div class="goat-item${flip ? ' flip' : ''}" style="left:${x}px;top:${y}px;--gw:${losers.length > 1 ? 124 : 158}px;animation-delay:${i * 0.25}s">

  }).join('') + `<div class="goat-title">${who}<em>${word}</em><small>Торкніться екрана, щоб побачити рахунок</small></div>`;
  wrap.hidden = false;
  losers.forEach((_, i) => Sfx.bleat(i * 0.7));

}

  const team = p => Number.isInteger(myPos) ? (p % 2 === myPos % 2 ? ['Ми', 'us'] : ['Вони', 'them']) : (p % 2 ? ['Пара Б', 'them'] : ['Пара А', 'us']);

    } else {
      h += `<span class="pava empty ${tc}">+</span>`;
      if (!busy) h += `<button class="psit" data-sit="${g.code}:${p}">${mine ? 'Пересісти' : 'Сісти сюди'}</button>`;
      if (mine) h += `<button class="plink" data-botpos="${p}">посадити робота</button>`;

  h += `</div>`;
  if (mine) h += `<div class="gbtns col">${free > 0 ? `<button class="btn primary" data-fill="seats">Почати · решта місць — роботи</button>` : ''}<button class="btn" data-stand="1">Встати з-за столу</button></div>`;
  return h + `</div>`;
}

      } catch (e) {}
    }, delay || 0);
  },
  get(k) {
    return new Promise(res => {
      const loc = this.local(k), cs = this.cs();
      if (!cs) return res(loc);
      let done = false; const fin = v => { if (!done) { done = true; res(v); } };
      setTimeout(() => fin(loc), 2500);
      try {
        cs.getItem(k, (err, v) => {
          if (err || !v) return fin(loc);
          const m = /^#parts:(\d+)$/.exec(v);
          if (!m) return fin(v);
          const keys = [...Array(+m[1]).keys()].map(i => k + '_' + i);
          cs.getItems(keys, (e2, obj) => fin(e2 || !obj ? loc : keys.map(x => obj[x] || '').join('')));
        });
      } catch (e) { fin(loc); }
    });
  },
};

Object.assign(Sfx, {
  ac() {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    this.ctx = this.ctx || new C();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  noise(ctx, t, len, freq, q, vol, type) {
    const n = Math.floor(ctx.sampleRate * len), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = b; f.type = type || 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.setValueAtTime(q, t);
    g.gain.setValueAtTime(vol, t);
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t);
    return f;
  },
  tone(ctx, t, freq, len, vol, type) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + len + 0.02);
    return o;
  },
  play(kind) {
    if (!G.set.sfx) return;
    try {
      const ctx = this.ac(); if (!ctx) return;
      const t = ctx.currentTime + 0.01;
      if (kind === 'card') this.noise(ctx, t, 0.07, 2600, 0.9, 0.35);
      else if (kind === 'beat') { this.noise(ctx, t, 0.07, 2200, 0.9, 0.35); this.tone(ctx, t, 150, 0.09, 0.18); }
      else if (kind === 'trump') { this.noise(ctx, t, 0.09, 1800, 0.8, 0.45); const o = this.tone(ctx, t, 220, 0.16, 0.22, 'triangle'); o.frequency.exponentialRampToValueAtTime(110, t + 0.15); }
      else if (kind === 'intercept') { this.noise(ctx, t, 0.05, 3000, 1, 0.35); this.noise(ctx, t + 0.09, 0.05, 3000, 1, 0.35); this.tone(ctx, t + 0.09, 520, 0.12, 0.08, 'triangle'); }
      else if (kind === 'collect') { const f = this.noise(ctx, t, 0.28, 900, 0.6, 0.22, 'lowpass'); f.frequency.exponentialRampToValueAtTime(3500, t + 0.25); }
      else if (kind === 'ach') [523, 659, 784, 1046].forEach((f, i) => this.tone(ctx, t + i * 0.09, f, 0.25, 0.09, 'triangle'));
    } catch (e) {}
  },
  forAction(a, trump) {
    if (a.type === 'cover') this.play(a.cards.some(c => L.suitOf(c) === trump) ? 'trump' : 'beat');
    else if (a.type === 'intercept') this.play('intercept');
    else if (a.type === 'attack' || a.type === 'discard') this.play('card');
  },
});

// ---------- Взятки після роздачі: хто що забрав ----------
function revealHtml(rv, n, trump) {
  if (!rv || !rv.length) return '';
  const pts = c => L.ptsOf(c);
  let h = `<details class="reveal" open><summary style="cursor:pointer;font-family:var(--serif);font-weight:800;font-size:1.05rem">Хто що забрав</summary>`;
  for (let i = 0; i < rv.length; i++) {
    const cards = rv[i].slice().sort((a, b) => pts(b[0]) - pts(a[0]) || L.suitOf(a[0]) - L.suitOf(b[0]) || L.rankOf(b[0]) - L.rankOf(a[0]));
    const sum = cards.reduce((t, e) => t + pts(e[0]), 0);
    const team = n === 4 ? (i % 2 === 0 ? ' · наші' : ' · їхні') : '';
    h += `<div class="rv-row"><div class="rv-head"><span>${esc(nm(i))}${team}</span><span><b>${sum}</b> ${plural(sum, 'очко', 'очки', 'очок')}</span></div><div class="rv-cards">`;
    if (!cards.length) h += `<span class="rv-empty">жодної взятки</span>`;
    for (const [c, hid] of cards) {
      const s = L.suitOf(c);
      const cls = 'rc' + (s >= 2 ? ' red' : '') + (pts(c) ? '' : ' zero') + (s === trump ? ' trump' : '') + (hid ? ' disc' : '');
      h += `<span class="${cls}" title="${hid ? 'скинута сорочкою догори' : ''}">${L.RANK_LABEL[L.rankOf(c)]}${L.SUIT_SYM[s]}</span>`;
    }
    h += `</div></div>`;
  }
  h += `<p class="rv-legend">Пунктиром — карти, скинуті сорочкою догори. Золота рамка — козирі.</p></details>`;
  return h;
}

      text: 'Бот походив вісімкою ♠. У вас <b>чотири валети</b>, тобто чотири карти одного номіналу. Можна перехопити хід: карта бота повернеться йому, а бити доведеться вже йому. Натисніть «Перехопити 4 картами».',
      check: a => a.type === 'intercept' || 'Натисніть «Перехопити 4 картами».',
      done: 'Бот не зміг побити чотири валети й скинув чотири карти. Взятка ваша. Перехопити можна, коли на руці 4 карти однієї масті або одного номіналу.' },
  ],
  deal(L_) {
    const C = this.C.bind(this), me = L_.me.map(C), bot = L_.bot.map(C), trump = L.SUIT_SYM.indexOf(L_.trump);
    const used = new Set([...me, ...bot]);
    const rest = [...Array(36).keys()].filter(c => !used.has(c));
    const trumpCard = rest.find(c => L.suitOf(c) === trump);
    const stock = L.shuffle(rest.filter(c => c !== trumpCard), G.rng); stock.push(trumpCard);
    return { n: 2, trump, trumpCard, stock, hands: [me, bot], piles: [[], []], attacker: L_.attacker, phase: 'attack', table: null,
      lastTrick: null, trumpHolder: null, known: [new Map(), new Map()], knownHidden: [new Set(), new Set()], trumpChanges: 0 };
  },
  start(i) {
    if (G.net.room) { netSend({ t: 'leave' }); G.net.room = null; }
    clearTimeout(G.timer);
    const les = this.LESSONS[i];
    if (!les) return this.finale();
    G.tut = { i, err: '' }; G.mode = 2; G.started = true; G.gameStart = null;
    G.ser = L.newSeries(2, 12); G.deal = this.deal(les);
    G.sel.clear(); G.notes = []; G.chips = { [les.attacker]: 'перший' }; G.prompt = ''; G.pending = ''; G.busy = false; G.turnLeft = null;
    closeSheet(); this.show(); render(); later(step, 900);
  },
  show() {
    const el = $('tut');
    if (!G.tut) { el.hidden = true; return; }
    const les = this.LESSONS[G.tut.i];
    el.innerHTML = `<button class="x" id="tutX" aria-label="Вийти з навчання">✕</button><b class="t">Урок ${G.tut.i + 1} з ${this.LESSONS.length}: ${les.title}</b>${les.text}` +
      (G.tut.err ? `<span class="err">${G.tut.err}</span>` : '');
    el.hidden = false;
    $('tutX').onclick = () => { G.tut = null; this.show(); G.started = false; G.deal = null; G.ser = null; clearTimeout(G.timer); render(); openMenu(true); };
  },
  check(a) {
    const r = this.LESSONS[G.tut.i].check(a);
    if (r === true) { G.tut.err = ''; this.show(); return true; }
    G.tut.err = r; this.show(); haptic.bad(); return false;
  },
  botAction(s) {
    const les = this.LESSONS[G.tut.i];
    if (s.phase === 'attack' && les.botAttack && !G.tut.botDone) { G.tut.botDone = true; return { type: 'attack', cards: les.botAttack.map(c => this.C(c)) }; }
    return AI.chooseAction(s, 'easy', G.rng);
  },
  done() {
    const i = G.tut.i, les = this.LESSONS[i], last = i === this.LESSONS.length - 1;
    haptic.good(); Sfx.play('ach');
    $('tut').hidden = true;
    openSheet(`<h2>✓ ${les.title}</h2><p>${les.done}</p><div class="stack"><button class="btn primary" id="tutNext">${last ? 'Останнє: як рахуються очки' : 'Наступний урок'}</button><button class="btn" id="tutMenu">Вийти в меню</button></div>`, 'tutorial');
    $('tutNext').onclick = () => this.start(i + 1);
    $('tutMenu').onclick = () => { G.tut = null; G.started = false; G.deal = null; G.ser = null; render(); openMenu(true); };
  },
  finale() {
    G.tut = null; this.show(); G.started = false; G.deal = null; G.ser = null; render();
    openSheet(`<h2>Рахунок і козел</h2><div class="rules"><p>Очки в картах: туз 11, десятка 10, король 4, дама 3, валет 2, решта 0. Усього в колоді 120.</p>
      <p>Після роздачі рахують очки у взятках. Хто набрав менше 60, отримує <b>штрафні</b>: 1 штрафне, якщо менше 60; 2 — якщо 30 і менше; 4 — якщо жодного очка. 60 на 60 — «яйця»: наступна роздача зі штрафами ×2.</p>
      <p>Хто першим набере 12 штрафних — <b>козел</b>. А якщо в когось 6, а в суперника жодного — це <b>молочний козел</b>, і гра закінчується одразу.</p></div>
      <div class="stack"><button class="btn primary" id="tutPlay">Зіграти з роботом</button><button class="btn" id="tutMenu">У меню</button></div>`, 'tutorial');
    $('tutPlay').onclick = () => { G.mode = 2; G.level = 'slava'; clearSave(); startSeries(); };
    $('tutMenu').onclick = () => openMenu(true);
  },
};

// ---------- Поділитися результатом: картинка + Telegram ----------
const Share = {

  async draw(ser, losers) {
    const W = 1080, H = 1350, cv = document.createElement('canvas');

    const g = cv.getContext('2d'), css = getComputedStyle(document.documentElement);

    try { await document.fonts.ready; } catch (e) {}
    const bg = g.createRadialGradient(W / 2, H * 0.42, 60, W / 2, H * 0.5, H * 0.8);
    bg.addColorStop(0, v('--wood-1') || '#4a3222'); bg.addColorStop(1, v('--wood-2') || '#2b1d14');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.globalAlpha = 0.05; g.fillStyle = '#ffdcaa';
    for (let x = 0; x < W; x += 9) g.fillRect(x, 0, 2, H);

    g.font = '800 64px "Playfair Display", Georgia, serif'; g.fillText('Боярський козел', W / 2, 120);

    const img = new Image();
    await new Promise(res => { img.onload = res; img.onerror = res; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(goatSvg(0).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" ')); });
    try { g.drawImage(img, W / 2 - 260, 170, 520, 520); } catch (e) {}
    const n = ser.n;
    const names = losers.map(p => nm(p) === 'Ви' ? (G.net.me ? G.net.me.name : 'Я') : nm(p)).join(' і ');
    const word = losers.length > 1 ? (ser.milk ? 'МОЛОЧНІ КОЗЛИ' : 'КОЗЛИ') : (ser.milk ? 'МОЛОЧНИЙ КОЗЕЛ' : 'КОЗЕЛ');
    g.font = '700 62px "Playfair Display", Georgia, serif'; g.fillStyle = ink;
    g.fillText(names.length > 30 ? names.slice(0, 29) + '…' : names, W / 2, 780);
    g.font = '800 104px "Playfair Display", Georgia, serif'; g.fillStyle = brass;
    g.fillText(word, W / 2, 900);
    // рахунок
    const rows = n === 4 ? [['Ми', ser.penalties[0]], ['Вони', ser.penalties[1]]]
      : [...Array(n).keys()].map(i => [nm(i) === 'Ви' ? (G.net.me ? G.net.me.name : 'Я') : nm(i), ser.penalties[i]]);
    g.font = '500 44px Rubik, system-ui, sans-serif'; g.fillStyle = ink;
    const top = 990, lh = 64;
    rows.forEach(([name, pen], i) => {
      const y = top + i * lh;
      g.textAlign = 'left'; g.fillText(String(name).slice(0, 22), 250, y);
      g.textAlign = 'right'; g.fillText(pen + ' штрафних', W - 250, y);
    });
    g.textAlign = 'center'; g.font = '400 34px Rubik, system-ui, sans-serif'; g.fillStyle = 'rgba(246,239,223,.7)';
    const cfg = window.KOZEL_ONLINE || {};
    g.fillText(new Date().toLocaleDateString('uk-UA') + (cfg.bot ? `  ·  @${cfg.bot}` : ''), W / 2, H - 60);
    return { data: cv.toDataURL('image/jpeg', 0.86), text: `${names}: ${word.toLowerCase()} 🐐 (${rows.map(r => r[1]).join(' : ')}) — «Боярський козел»` };
  },
  async result(ser, losers) {
    toast('Готуємо картинку…');
    let pic;
    try { pic = await this.draw(ser, losers); } catch (e) { toast('Не вдалося намалювати картинку'); return; }
    this.pic = pic;
    if (window.KOZEL_ONLINE) {
      netSend({ t: 'share', img: pic.data, text: pic.text });
      this.timer = setTimeout(() => this.ready({}), 8000);
    } else this.ready({});
  },
  ready(m) {
    clearTimeout(this.timer);
    const pic = this.pic; if (!pic) return;
    this.pic = null;
    const url = m.url || null;
    let h = `<h2>Поділитися</h2><img class="share-prev" src="${pic.data}" alt="Результат партії">`;
    h += `<div class="stack">`;
    if (m.prepared && TG && tgv('8.0')) h += `<button class="btn primary" id="shMsg">Надіслати в чат</button>`;
    if (url && TG && tgv('7.8')) h += `<button class="btn" id="shStory">Опублікувати в історії</button>`;
    if (!m.prepared && TG) h += `<button class="btn${m.prepared ? '' : ' primary'}" id="shLink">Надіслати посилання на гру</button>`;
    if (url && TG && tgv('8.0')) h += `<button class="btn" id="shSave">Зберегти картинку</button>`;
    else if (!TG) h += `<button class="btn primary" id="shNative">Поділитися / зберегти</button>`;
    h += `<button class="btn" id="shBack">Назад</button></div>`;
    const prevKind = G.sheetKind;
    openSheet(h, 'share');
    const back = () => { if (prevKind === 'dealEnd' && G.lastDealEnd) G.lastDealEnd(); else closeSheet(); };
    $('shBack').onclick = back;
    if ($('shMsg')) $('shMsg').onclick = () => { try { TG.shareMessage(m.prepared, ok => { if (ok) toast('Надіслано'); }); } catch (e) {} };
    if ($('shStory')) $('shStory').onclick = () => {
      try { TG.shareToStory(url, { text: pic.text.slice(0, 200), widget_link: m.link ? { url: m.link, name: 'Грати' } : undefined }); } catch (e) { toast('Історії недоступні'); }
    };
    if ($('shLink')) $('shLink').onclick = () => {
      const link = m.link || location.origin;
      TG.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(pic.text));
    };
    if ($('shSave')) $('shSave').onclick = () => { try { TG.downloadFile({ url, file_name: 'kozel.jpg' }); } catch (e) {} };
    if ($('shNative')) $('shNative').onclick = async () => {
      try {
        const blob = await (await fetch(pic.data)).blob();
        const file = new File([blob], 'kozel.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: pic.text }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = pic.data; a.download = 'kozel.jpg'; document.body.appendChild(a); a.click(); a.remove();
    };
  },
};


// ===================================================================
// ---------- Стіл «Віяло»: підсвітка, місця для карт, перетягування, остання взятка ----------
// Які карти зараз підходять (зелена рамка), а які ні (притьмарені)
function handHints(s, myTurn) {
  const ok = new Set(), dim = new Set();
  if (!s || !myTurn || !hintsOn()) return { ok, dim };
  const hand = s.hands[0], sel = [...G.sel];
  if (s.phase === 'defend') {
    const covers = L.legalActions(s).filter(a => a.type === 'cover');
    if (!covers.length) return { ok, dim }; // побити нічим — усі карти рівні, лишається скинути
    const fit = sel.length ? covers.filter(a => sel.every(x => a.cards.includes(x))) : covers;
    for (const a of (fit.length ? fit : covers)) a.cards.forEach(c => ok.add(c));
    for (const c of hand) if (!ok.has(c)) dim.add(c);
  } else if (s.phase === 'attack' && sel.length) {
    for (const c of hand) if (!G.sel.has(c) && !L.isUniform([...sel, c])) dim.add(c);
  }
  return { ok, dim };
}
// Вибрані карти → на яку карту суперника кожна ляже (найбільше «побитих»; решта — на скидання)
function pairSel(top, sel, trump) {
  let best = top.map(() => null), bestN = -1;
  const cur = top.map(() => null);
  const rec = (i, n) => {
    if (i === sel.length) { if (n > bestN) { bestN = n; best = cur.slice(); } return; }
    for (let j = 0; j < top.length; j++) if (cur[j] === null && L.beats(sel[i], top[j], trump)) { cur[j] = sel[i]; rec(i + 1, n + 1); cur[j] = null; }
    rec(i + 1, n);
  };
  rec(0, 0);
  const res = best.map(c => c === null ? null : { c, ok: true });
  for (const c of sel) if (!best.includes(c)) { const j = res.indexOf(null); if (j >= 0) res[j] = { c, ok: false }; }
  return res;
}
// Перетягування карти на стіл: відпустили над столом — хід, якщо він уже повний
const Drag = {
  start(e, c, el) {
    if (e.button > 0) return;
    const d = { c, el, x: e.clientX, y: e.clientY, on: false, id: e.pointerId };
    this.d = d;
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    el.onpointermove = ev => this.move(ev);
    el.onpointerup = ev => this.end(ev, false);
    el.onpointercancel = ev => this.end(ev, true);
  },
  zone() { const r = $('cross').getBoundingClientRect(); return { l: r.left - 20, t: r.top - 30, r: r.right + 20, b: r.bottom + 10 }; },
  over(ev) { const z = this.zone(); return ev.clientX >= z.l && ev.clientX <= z.r && ev.clientY >= z.t && ev.clientY <= z.b; },
  move(ev) {
    const d = this.d; if (!d || ev.pointerId !== d.id) return;
    const dx = ev.clientX - d.x, dy = ev.clientY - d.y;
    if (!d.on) {
      if (Math.hypot(dx, dy) < 10) return;
      d.on = true;
      const r = d.el.getBoundingClientRect();
      d.g = d.el.cloneNode(true); d.g.classList.add('drag-ghost'); d.g.classList.remove('sel', 'dim', 'ok');
      d.g.style.width = r.width + 'px'; d.g.style.height = r.height + 'px'; d.g.style.top = '0'; d.g.style.left = '0';
      d.ox = d.x - r.left; d.oy = d.y - r.top;
      document.body.appendChild(d.g); d.el.classList.add('dragging');
    }
    d.g.style.transform = `translate(${ev.clientX - d.ox}px, ${ev.clientY - d.oy}px) rotate(4deg)`;
    $('cross').classList.toggle('drop', this.over(ev));
  },
  end(ev, cancel) {
    const d = this.d; if (!d) return;
    this.d = null;
    d.el.onpointermove = d.el.onpointerup = d.el.onpointercancel = null;
    $('cross').classList.remove('drop');
    if (!d.on) return; // звичайне натискання — спрацює onclick
    d.g.remove(); d.el.classList.remove('dragging');
    this.justDropped = true; setTimeout(() => { this.justDropped = false; }, 60);
    if (!cancel && this.over(ev)) dropCard(d.c); else renderCore();
  },
};
function dropCard(c) {
  const s = G.deal;
  if (!s || G.busy || L.toAct(s) !== 0) return;
  haptic.tap();
  if (s.phase === 'attack') {
    if (!G.sel.has(c)) G.sel.add(c);
    if (!L.isUniform([...G.sel])) G.sel = new Set([c]);
    return act({ type: 'attack', cards: [...G.sel] });
  }
  if (s.phase === 'defend') {
    const n = s.table.top.length;
    G.sel.add(c);
    if (G.sel.size > n) G.sel = new Set([c]);
    const sel = [...G.sel];
    if (sel.length === n && L.canCover(s.table.top, sel, s.trump)) return act({ type: 'cover', cards: sel });
    render();
  }
}
// Остання взятка: хто забрав і що там було (скинуті сорочкою — закриті, крім своїх)
function captureTrick(s) {
  const t = s.table, w = L.trickWinner(s);
  const cards = t.attack.map(c => [c, 0, t.by]);
  for (const l of t.layers) for (const c of l.cards) cards.push([l.type === 'discard' && l.p !== 0 ? -1 : c, l.type === 'discard' ? 1 : 0, l.p]);
  return { w, cards };
}
function showLastTrick(lt) {
  const el = $('peek'), n = n_();
  let h = `<div class="peek-card" role="dialog" aria-label="Остання взятка"><h3>${lt.w === 0 ? 'Ваша взятка' : 'Взятку забрав: ' + esc(nm(lt.w))}</h3>`;
  const by = Array.from({ length: n }, () => []);
  for (const [c, hid, p] of lt.cards) if (by[p]) by[p].push([c, hid]);
  by.forEach((cs, p) => {
    if (!cs.length) return;
    h += `<div class="peek-row"><span>${esc(nm(p))}</span><div class="cards" data-p="${p}"></div></div>`;
  });
  h += `<p>Карти сорочкою догори — скинуті, їх побачите після роздачі. Торкніться, щоб закрити.</p></div>`;
  el.innerHTML = h;
  by.forEach((cs, p) => {
    const box = el.querySelector(`[data-p="${p}"]`); if (!box) return;
    for (const [c, hid] of cs) box.appendChild(cardEl(hid && c < 0 ? null : c, { cls: hid && c >= 0 ? 'nobeat' : '' }));
  });
  el.hidden = false; haptic.tap();
  el.onclick = () => { el.hidden = true; };
}

// ---------- Онлайн-кімната: хто зараз у грі, запрошення зіграти ----------
// Вас запросили: прийняти чи відхилити
function showInvite(m) {
  const el = $('inviteBox');
  el.innerHTML = `<div class="pause-card" role="alertdialog" aria-label="Запрошення"><h2>Запрошення</h2>
    <p class="who"><b>${esc(m.from.name)}</b> кличе вас грати в «Боярського козла».</p>
    ${G.started && !G.net.room ? '<p>Вашу партію з роботом буде збережено.</p>' : ''}
    <div class="stack"><button class="btn primary" id="invYes">Сісти за стіл</button><button class="btn" id="invNo">Не зараз</button></div></div>`;
  el.hidden = false; haptic.good(); Sfx.play('ach');
  clearTimeout(showInvite.tm); showInvite.tm = setTimeout(() => { if (!el.hidden) { el.hidden = true; netSend({ t: 'inviteReply', to: m.from.id, ok: false }); } }, 60000);
  $('invYes').onclick = () => {
    el.hidden = true; clearTimeout(showInvite.tm);
    if (G.started && !G.net.room) { saveGame(); clearTimeout(G.timer); G.started = false; }
    G.tut = null; Tut.show();
    G.net.lobbyOpen = true; netSend({ t: 'join', code: m.code });
  };
  $('invNo').onclick = () => { el.hidden = true; clearTimeout(showInvite.tm); netSend({ t: 'inviteReply', to: m.from.id, ok: false }); };
}
// Однакові сповіщення «вийшов / повернувся» — не частіше разу на 2 хвилини
function notifyOnce(key) {
  const now = Date.now(); notifyOnce.seen = notifyOnce.seen || {};
  if (now - (notifyOnce.seen[key] || 0) < 120000) return false;
  notifyOnce.seen[key] = now; return true;
}
// Господар закриває стіл для всіх (друге натискання — підтвердження)
function confirmClose(b) {
  if (!b.dataset.sure) {
    const t = b.textContent; b.dataset.sure = '1'; b.textContent = 'Точно завершити для всіх? Натисніть ще раз';
    setTimeout(() => { if (b.isConnected && b.dataset.sure) { delete b.dataset.sure; b.textContent = t; } }, 4000);
    return;
  }
  haptic.act(); G.net.lobbyOpen = false; toast('Гру завершено'); netSend({ t: 'end', code: b.dataset.code || (G.net.room && G.net.room.code) || (G.net.lastRoom && G.net.lastRoom.code) });
}

G.prompt = 'Оберіть гру в меню.';
render();
openMenu();
if (window.KOZEL_ONLINE) {
  // запрошення: t.me/бот/гра?startapp=КОД або ?room=КОД у браузері
  const q = new URLSearchParams(location.search).get('room');
  const sp = TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param;
  G.net.join = (sp || q || '').replace(/\D/g, '') || null;
  G.net.lobbyOpen = true;
  netConnect();
  // безкоштовний сервер може «спати»: показуємо, що ми не зависли
  if (G.net.join) toast(`Під’єднуємось до столу ${G.net.join}…`);
  setTimeout(() => { if (!G.net.ws || G.net.ws.readyState !== 1) toast('Сервер прокидається, це може зайняти до хвилини…'); }, 4000);
}
