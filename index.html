<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Боярський козел</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wood-1:#4a3222; --wood-2:#2b1d14; --wood-grain:rgba(255,220,170,.035);
  --ink:#f1e6d0; --ink-muted:#b9a58a; --line:rgba(241,230,208,.14);
  --face:#f6efdf; --face-edge:#d9cbae; --red:#b42318; --black:#1e1a17;
  --brass:#d4a73a; --brass-ink:#2b1d14;
  --back-1:#6b1f2a; --back-2:#521520;
  --sheet:#241811; --btn:#3a281c;
  --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans:'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --wood-1:#c89a66; --wood-2:#9c6b3f; --wood-grain:rgba(60,30,10,.05);
    --ink:#2a1a0f; --ink-muted:#5a3e27; --line:rgba(42,26,15,.18);
    --sheet:#f3e7d2; --btn:#e2cba8; --brass-ink:#2a1a0f;
  }
}
:root[data-theme="dark"]{
  --wood-1:#4a3222; --wood-2:#2b1d14; --ink:#f1e6d0; --ink-muted:#b9a58a; --sheet:#241811; --btn:#3a281c;
}
:root[data-theme="light"]{
  --wood-1:#c89a66; --wood-2:#9c6b3f; --wood-grain:rgba(60,30,10,.05);
  --ink:#2a1a0f; --ink-muted:#5a3e27; --line:rgba(42,26,15,.18);
  --sheet:#f3e7d2; --btn:#e2cba8; --brass-ink:#2a1a0f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans); color:var(--ink);
  background:
    repeating-linear-gradient(92deg, var(--wood-grain) 0 2px, transparent 2px 9px),
    radial-gradient(120% 80% at 50% 45%, var(--wood-1), var(--wood-2));
  background-color:var(--wood-2);
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 12px 12px;gap:8px}
button{font:inherit;color:inherit}

.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-weight:800;font-size:1.15rem;letter-spacing:.01em;flex:1;line-height:1}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.72rem;color:var(--ink-muted);margin-top:3px;letter-spacing:0}
.score{display:flex;gap:6px;align-items:stretch;background:none;border:0;padding:0;color:inherit;cursor:pointer;font:inherit}
.score:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:10px}
.sc{width:48px;height:56px;flex:none;display:grid;grid-template-rows:14px 1fr 6px;justify-items:center;align-items:center;padding:5px 5px 6px;border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.14)}
.sc span{font:600 .62rem/14px var(--sans);letter-spacing:.06em;color:var(--ink-muted);white-space:nowrap;overflow:hidden;max-width:100%}
.sc b{font:800 1.25rem/1 var(--serif);font-variant-numeric:tabular-nums}
.sc>i{display:block;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;align-self:end}
.sc>i>i{display:block;height:100%;background:var(--brass)}
.sc.me{border-color:rgba(212,167,58,.55)}
.sc.warn b{color:#e0786d}
.sc.warn>i>i{background:var(--red)}
.mult{align-self:center;background:var(--brass);color:var(--brass-ink);font-weight:600;border-radius:6px;padding:3px 7px;font-size:.85rem}
.icon{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:1.1rem;cursor:pointer}

.pilecount{font-size:.78rem;color:var(--ink-muted);line-height:1.35}
.pilecount b{color:var(--ink);font-weight:600}
.me-row{display:flex;justify-content:space-between;align-items:flex-end}

.middle{flex:1;display:flex;align-items:center;gap:14px;min-height:0}
.stock{position:relative;width:104px;height:118px;flex:none;--sw:min(15vw,64px)}
.stock .card{position:absolute;--w:var(--sw)}
.stock .trumpcard{left:calc(var(--sw)*.62);top:calc(var(--sw)*.22);transform:rotate(90deg)}
.stock .deck{left:0;top:0}
.stock .cnt{position:absolute;left:0;top:calc(var(--sw)*1.4 + 8px);width:104px;text-align:left;line-height:1.3;font-size:.78rem;color:var(--ink-muted)}
.stock .suitonly{position:absolute;left:0;top:10px;width:60px;height:60px;border:1px dashed var(--line);border-radius:50%;display:grid;place-items:center;font-size:1.8rem}
.table{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px 8px;min-height:130px}
.slot .card{position:absolute;left:0;top:0}
@keyframes land{from{transform:translateY(40px) rotate(0);opacity:0}to{transform:rotate(9deg);opacity:1}}

.msg{min-height:2.8em;font-size:.92rem;line-height:1.4;text-align:center;padding:0 6px;text-wrap:balance}

.hand{display:flex;justify-content:center;gap:6px}
#myHand{min-height:calc(var(--cw)*1.4 + 14px);align-items:flex-end}

/* Карта */
.card{
  --w:var(--cw);
  width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.1);
  background:var(--face);border:1px solid var(--face-edge);
  box-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.28);
  position:relative;color:var(--black);padding:0;flex:none;
  font-family:var(--serif);user-select:none;
}
.card.red{color:var(--red)}
.card .idx{position:absolute;left:7%;top:5%;display:flex;flex-direction:column;align-items:center;line-height:.95;font-weight:800;font-size:calc(var(--w)*.26)}
.card .idx i{font-style:normal;font-size:.78em;font-family:var(--sans)}
.card .idx.b{left:auto;top:auto;right:7%;bottom:5%;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.5);font-family:var(--sans)}
.card.trump::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--brass);border-radius:calc(var(--w)*.08);pointer-events:none}
.card.back{
  background:
    repeating-linear-gradient(45deg, rgba(212,167,58,.28) 0 1.5px, transparent 1.5px 7px),
    repeating-linear-gradient(-45deg, rgba(212,167,58,.28) 0 1.5px, transparent 1.5px 7px),
    linear-gradient(var(--back-1),var(--back-2));
  border:3px solid var(--face);
}
.card.sm{--w:44px}
.card.tbl{--w:var(--cw-t)}
button.card{cursor:pointer;transition:translate .235s cubic-bezier(.2,.8,.2,1),box-shadow .235s ease}
button.card:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
button.card.sel{translate:0 -16px;box-shadow:0 0 0 3px var(--brass),0 10px 18px rgba(0,0,0,.35)}
button.card:disabled{cursor:default}
#app{--cw:min(21vw,96px);--cw-t:min(15vw,70px)}

.actions{display:flex;gap:8px;min-height:50px}
.btn{flex:1;min-height:50px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-weight:600;font-size:.98rem;cursor:pointer;padding:0 10px}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.icon:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* Аркуш */
.sheet{position:fixed;inset:0;background:rgba(10,6,4,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet-card{background:var(--sheet);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 20px 20px;max-height:88vh;overflow:auto}
.sheet h2{font-family:var(--serif);font-weight:800;font-size:1.6rem;margin:0 0 6px;line-height:1.15}
.sheet p{margin:.4em 0;line-height:1.5;color:var(--ink-muted)}
.sheet .big{font-family:var(--serif);font-size:2.6rem;font-weight:800;text-align:center;margin:10px 0 2px;color:var(--ink)}
.sheet .big span{font-size:1rem;font-family:var(--sans);font-weight:400;color:var(--ink-muted);margin:0 10px}
.sheet .stack{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .row{display:flex;gap:8px}
.rules{font-size:.9rem;line-height:1.55;color:var(--ink-muted)}
.rules h3{font-family:var(--serif);color:var(--ink);font-size:1.05rem;margin:14px 0 4px}
.rules ul{padding-left:1.1em;margin:4px 0}
.levels .btn[aria-pressed="true"]{outline:2px solid var(--brass)}
.tally{display:flex;justify-content:space-around;margin-top:10px;text-align:center}
.tally div{font-size:.8rem;color:var(--ink-muted)}
.tally b{display:block;font-family:var(--serif);font-size:1.6rem;color:var(--ink)}
@media (max-height:640px){#app{--cw:min(18vw,80px);--cw-t:min(13vw,58px)} .opp{min-height:64px}}

.opp{display:flex;justify-content:space-between;align-items:flex-start;min-height:84px;gap:10px}
.seat{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.seat.right{align-items:flex-end}
.seat .nm{font-size:.82rem;color:var(--ink-muted)}
.seat.active .nm{color:var(--brass);font-weight:600}
.seat .hand .card{margin-left:-14px}.seat .hand .card:first-child{margin-left:0}
.slot{position:relative;width:calc(var(--cw-t)*1.25);height:calc(var(--cw-t)*1.75)}
.slot.deep{width:calc(var(--cw-t)*1.45);height:calc(var(--cw-t)*2)}
.slot .card.l1{left:18%;top:20%;transform:rotate(9deg)}
.slot .card.l2{left:34%;top:40%;transform:rotate(-7deg)}
.slot.deeper{width:calc(var(--cw-t)*1.65);height:calc(var(--cw-t)*2.25)}
.slot .card.l3{left:50%;top:58%;transform:rotate(5deg)}
.seat.center{align-items:center}
.opp.four .seat .hand .card{margin-left:-28px}
.opp.four .seat .hand .card:first-child{margin-left:0}
.seat .nm em{font-style:normal;opacity:.75}
.slot .card.new{animation:drop .28s ease-out}
@keyframes drop{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
@media (prefers-reduced-motion: reduce){.slot .card.new{animation:none}}
.res{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
.res th{font-weight:400;color:var(--ink-muted);font-size:.78rem;text-align:right;padding:4px 6px}
.res th:first-child,.res td:first-child{text-align:left}
.res td{padding:7px 6px;text-align:right;border-top:1px solid var(--line)}
.res td b{font-family:var(--serif);font-size:1.15rem}
.places{margin:8px 0 0;padding-left:1.3em;line-height:1.7}
.pause{position:fixed;inset:0;z-index:12;background:rgba(10,6,4,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.pause[hidden]{display:none}
.pause-card{background:var(--sheet);color:var(--ink);border-radius:16px;padding:22px 20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5);border:1px solid var(--line)}
.pause-card h2{font-family:var(--serif);font-weight:800;font-size:1.5rem;margin:0 0 8px}
.pause-card p{margin:.45em 0;line-height:1.5;color:var(--ink-muted)}
.pause-card p.who{color:var(--ink);font-size:1.05rem}
.pause-card .stack{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.pause-card .btn{width:100%;flex:none;min-height:48px}
.icon#musicBtn{position:relative;font-size:1.05rem}
.icon#musicBtn.off{opacity:.45}
.icon#musicBtn.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:currentColor;transform:rotate(-45deg)}
.crowded .brand{width:48px;height:48px;margin:-2px 0}
.crowded .score{flex:1;justify-content:flex-start}
.brand{flex:none;width:64px;height:64px;margin:-3px 0;align-self:center;min-width:0;display:block}
.brand svg{width:100%;height:100%;display:block}
header.top .score{margin-left:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand small{overflow:hidden;text-overflow:ellipsis}
.top .icon{width:36px;height:36px;flex:none}
#chatBtn{position:relative;font-size:1rem}
#chatBtn .badge{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:600 .68rem var(--sans);display:grid;place-items:center;padding:0 4px}
#chatBtn .badge[hidden]{display:none}
.chat{position:fixed;inset:0;z-index:13;background:rgba(10,6,4,.55);display:flex;align-items:flex-end;justify-content:center}
.chat[hidden]{display:none}
.chat-card{background:var(--sheet);color:var(--ink);width:100%;max-width:520px;height:min(72vh,560px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px;font-family:var(--serif);font-size:1.15rem}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px;overscroll-behavior:contain}
.msg-row{display:flex;flex-direction:column;align-items:flex-start;max-width:82%}
.msg-row.mine{align-self:flex-end;align-items:flex-end}
.msg-row .from{font-size:.72rem;color:var(--ink-muted);margin:0 8px 2px}
.msg-row .txt{background:var(--btn);border:1px solid var(--line);padding:8px 12px;border-radius:14px 14px 14px 4px;line-height:1.35;word-break:break-word}
.msg-row.mine .txt{background:var(--brass);color:var(--brass-ink);border-color:transparent;border-radius:14px 14px 4px 14px}
.chat-empty{margin:auto;color:var(--ink-muted);font-size:.9rem;text-align:center}
.chat-quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{flex:none;border:1px solid var(--line);background:var(--btn);border-radius:16px;padding:7px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.12);color:var(--ink);font:1rem var(--sans);padding:0 12px}
.chat-input .btn{flex:none;width:52px;padding:0;font-size:1.1rem}
.bubble{position:absolute;top:2px;z-index:3;max-width:150px;width:max-content;background:var(--ink);color:var(--wood-2);padding:6px 10px;border-radius:12px;font-size:.8rem;line-height:1.3;
  box-shadow:0 6px 16px rgba(0,0,0,.35);animation:bub .25s ease-out;word-break:break-word;text-align:left;white-space:normal}
.seat4.left .bubble{left:calc(100% + 4px)}
.seat4.right .bubble{right:calc(100% + 4px)}
.seat4.top .bubble{left:calc(50% + 32px)}
@keyframes bub{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.bubble{animation:none}}
.clock{grid-column:3;grid-row:1;justify-self:end;align-self:start;font:600 .8rem var(--sans);color:var(--ink-muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:4px}
.turnbar{position:relative;height:22px;border-radius:11px;background:rgba(0,0,0,.22);overflow:hidden;visibility:hidden;flex:none}
.turnbar.on{visibility:visible}
.turnbar i{position:absolute;left:0;top:0;bottom:0;width:var(--p,100%);background:var(--brass);opacity:.85;transition:width .25s linear}
.turnbar span{position:relative;display:block;text-align:center;font:600 .78rem/22px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.turnbar.low i{background:var(--red)}
.tl{font:600 .75rem var(--sans);color:var(--brass);font-variant-numeric:tabular-nums}
.tl.low{color:var(--red)}
.ava img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.ava .cnt4{z-index:1}
.mini-ava{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.25);font:700 .8rem var(--serif);
  vertical-align:middle;margin-right:8px;overflow:hidden;flex:none;color:var(--ink)}
.mini-ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini-ava.sm{width:20px;height:20px;font-size:.62rem;margin-right:5px}
.menu-err{margin:2px 2px 0;color:var(--red);font-size:.88rem;min-height:0}
.menu-err:empty{display:none}
.goat-wrap{position:fixed;inset:0;z-index:14;background:rgba(10,6,4,.78);animation:gfade .3s ease-out}
.goat-wrap[hidden]{display:none}
.goat-item{position:fixed;width:var(--gw,132px);transform:translate(-50%,-50%);animation:goatIn .5s cubic-bezier(.2,1.25,.45,1) backwards}
.goat-item svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.goat-bubble{position:absolute;left:74%;top:-14%;background:#f6efdf;color:#2e241a;border:2.5px solid #2e241a;border-radius:16px;padding:6px 12px;
  font:800 1.05rem var(--serif);white-space:nowrap;animation:bub .3s ease-out backwards}
.goat-bubble::after{content:"";position:absolute;left:-9px;bottom:9px;border:7px solid transparent;border-right-color:#2e241a}
.goat-title{position:fixed;left:50%;bottom:6%;transform:translate(-50%,0);background:rgba(20,13,8,.82);border:1px solid var(--line);border-radius:16px;padding:14px 20px 16px;text-align:center;color:var(--ink);font-family:var(--serif);font-weight:800;
  font-size:1.9rem;line-height:1.12;text-shadow:0 4px 18px rgba(0,0,0,.65);padding:0 18px;max-width:92vw;animation:titleIn .5s ease-out .15s backwards;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.goat-title em{font-style:normal;color:var(--brass);display:block;font-size:2.4rem}
.goat-title small{display:block;font:500 .92rem var(--sans);color:var(--ink-muted);margin-top:10px}
@keyframes gfade{from{opacity:0}to{opacity:1}}
@keyframes goatIn{from{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-8deg)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes titleIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.goat-item.flip svg{transform:scaleX(-1)}
.goat-item.flip .goat-bubble{left:auto;right:74%}
.goat-item.flip .goat-bubble::after{left:auto;right:-9px;border-right-color:transparent;border-left-color:#2e241a}
@media (prefers-reduced-motion: reduce){.goat-item,.goat-title,.goat-bubble{animation:none}}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.menu-lbl{font-size:.82rem;color:var(--ink-muted);margin:12px 0 -2px}

/* ===== Пара на пару: розкладка хрестом ===== */
.board4{flex:1;display:grid;grid-template-columns:72px 1fr 72px;grid-template-rows:auto 1fr;padding-bottom:8px;gap:4px;min-height:0;--c4:min(12vw,48px);--us:#7fb069;--them:#d0654f}
.board4[hidden]{display:none}
.seat4{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.seat4.top{grid-column:2;grid-row:1}
.seat4.left{grid-column:1;grid-row:2;align-self:center}
.seat4.right{grid-column:3;grid-row:2;align-self:center}
.ava{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:1.3rem;
  background:rgba(0,0,0,.28);border:2.5px solid var(--them);position:relative;transition:box-shadow .2s}
.seat4.mate .ava{border-color:var(--us)}
.seat4.empty{visibility:hidden}
.seat4.active .ava{box-shadow:0 0 0 4px var(--brass),0 0 18px rgba(212,167,58,.55)}
.ava .cnt4{position:absolute;right:-6px;bottom:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--back-1);color:#f6efdf;
  font:600 .72rem var(--sans);display:grid;place-items:center;border:1.5px solid var(--face);padding:0 4px}
.seat4 .nm4{font-size:.78rem;color:var(--ink-muted);line-height:1}
.seat4.active .nm4{color:var(--brass);font-weight:600}
.chip{font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--ink);color:var(--wood-2);line-height:1.3;white-space:nowrap}
.chip.win{background:var(--brass);color:var(--brass-ink)}
.chip.hide{visibility:hidden}
.cross{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 14px 1fr;grid-template-rows:auto auto auto;align-content:center;gap:10px 6px;align-items:center;justify-items:center;min-height:0}
.plays{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;min-height:calc(var(--c4)*1.4)}
.plays.p2{grid-column:1/4;grid-row:1;align-self:end}
.plays.p1{grid-column:1;grid-row:2;max-width:calc(var(--c4)*2 + 4px)}
.plays.p3{grid-column:3;grid-row:2;max-width:calc(var(--c4)*2 + 4px)}
.plays.p0{grid-column:1/4;grid-row:3;align-self:start}
.plays .card{--w:var(--c4)}
.plays .card .idx{font-size:calc(var(--w)*.3)}
.plays.top .card:not(.back){box-shadow:0 0 0 2.5px var(--brass),0 4px 10px rgba(0,0,0,.35)}
.plays .card.back{rotate:-6deg;opacity:.92}
.center4{grid-column:1/3;grid-row:1;justify-self:start;align-self:start;position:relative;width:112px;height:104px;z-index:1}
.center4 .card{position:absolute;--w:46px}
.center4 .trumpcard{left:49px;top:0;transform:rotate(90deg);box-shadow:0 0 0 2px var(--brass),0 0 14px rgba(212,167,58,.45),0 4px 10px rgba(0,0,0,.35)}
.center4 .trumpcard .idx{font-size:calc(var(--w)*.3)}
.center4 .deck{left:0;top:0;box-shadow:2px 2px 0 var(--face-edge),4px 4px 0 rgba(0,0,0,.25)}
.center4 .lbl{position:absolute;left:0;top:70px;font-size:.7rem;color:var(--ink-muted);line-height:1.25;white-space:nowrap}
.center4 .lbl b{font-size:.82rem;color:var(--ink);font-weight:600}
.center4 .lbl .sym{font-size:1.05rem;font-family:var(--sans)}
.center4 .suitonly{position:absolute;left:0;top:0;width:62px;height:62px;border:2px solid var(--brass);border-radius:50%;display:grid;place-items:center;font-size:2.1rem;background:rgba(0,0,0,.18)}
.sc.us{border-color:var(--us, #7fb069)}.sc.them{border-color:var(--them, #d0654f)}
body.m4 .opp, body.m4 .middle, body.m4 .msg, body.m4 .me-row{display:none}
body.m4 #app{--cw:min(22vw,100px)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--wood-2);
  padding:10px 16px;border-radius:10px;font-size:.9rem;font-weight:500;max-width:88vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.toast[hidden]{display:none}
.seats{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.seatrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-height:48px}
.seatrow.me{border-color:var(--brass)}
.seatrow .no{font-size:.75rem;color:var(--ink-muted);width:74px;flex:none;line-height:1.25}
.seatrow .who{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatrow .who i{font-style:normal;color:var(--ink-muted);font-weight:400}
.mini{border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:7px 10px;font-size:.85rem;font-weight:600;cursor:pointer;min-height:36px}
.mini:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;min-height:50px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.15);color:var(--ink);
  font:600 1.25rem var(--sans);letter-spacing:.3em;text-align:center;padding:0 12px}
.joinrow .btn{flex:none;width:auto;padding:0 18px}

/* ===== Сукно столу та сорочки (налаштування) ===== */
:root[data-back="blue"]{--back-1:#1f4a7a;--back-2:#153659}
:root[data-back="green"]{--back-1:#2a6a45;--back-2:#1c4a30}
:root[data-back="black"]{--back-1:#2b2724;--back-2:#171412}
/* повний екран у Telegram: не залазимо під годинник і кнопки Telegram */
body.tg-fs #app{padding-top:calc(10px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
body.tg-fs .toast{top:calc(12px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px))}
/* ===== Взятки після роздачі ===== */
.reveal{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.reveal h3{font-family:var(--serif);font-size:1.05rem;margin:0}
.rv-row{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rv-head{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-muted);margin-bottom:6px}
.rv-head b{color:var(--ink);font-family:var(--serif);font-size:1rem}
.rv-cards{display:flex;flex-wrap:wrap;gap:4px}
.rc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 5px;border-radius:5px;background:var(--face);color:var(--black);
  font:700 .82rem var(--serif);border:1px solid var(--face-edge);gap:1px}
.rc.red{color:var(--red)}
.rc.zero{opacity:.55;font-weight:500}
.rc.trump{box-shadow:inset 0 0 0 1.5px var(--brass)}
.rc.disc{border:1.5px dashed var(--ink-muted);background:transparent;color:var(--ink)}
.rc.disc.red{color:#e0786d}
.rv-legend{font-size:.75rem;color:var(--ink-muted);margin:2px 0 0}
.rv-empty{font-size:.82rem;color:var(--ink-muted)}
/* ===== Статистика, рейтинг, нагороди ===== */
.tabs{display:flex;gap:6px;margin:10px 0 4px}
.tabs .btn{min-height:40px;font-size:.9rem}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.statgrid div{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;font-size:.75rem;color:var(--ink-muted)}
.statgrid b{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--ink)}
.lb{width:100%;border-collapse:collapse;margin-top:8px;font-size:.9rem}
.lb th{font-weight:400;color:var(--ink-muted);font-size:.72rem;text-align:right;padding:4px 4px}
.lb th:nth-child(2),.lb td:nth-child(2){text-align:left}
.lb td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}
.lb td:first-child,.lb th:first-child{text-align:center;width:26px}
.lb tr.me td{color:var(--brass);font-weight:600}
.lb .nmx{display:flex;align-items:center;max-width:160px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ach{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.ach i{font-style:normal;font-size:1.6rem;line-height:1}
.ach b{display:block;font-size:.9rem}
.ach span{font-size:.75rem;color:var(--ink-muted);line-height:1.3}
.ach.locked{opacity:.42}
.ach.locked i{filter:grayscale(1)}
.ach-toast[hidden]{display:none}
.ach-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:21;background:var(--brass);color:var(--brass-ink);
  padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;animation:bub .3s ease-out;max-width:90vw}
.ach-toast i{font-style:normal;font-size:1.6rem}
.ach-toast small{display:block;font-weight:400;font-size:.8rem}
/* ===== Налаштування ===== */
.setrow{margin-top:12px}
.setrow .menu-lbl{margin:0 0 6px}
.setrow .row .btn{min-height:42px;font-size:.88rem;padding:0 6px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid rgba(255,255,255,.35)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.menu-grid .btn{min-height:58px;font-size:.82rem;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.menu-grid .btn i{font-style:normal;font-size:1.25rem}
/* ===== Підказка й навчання ===== */
.btn.hint{flex:none;width:46px;padding:0;font-size:1.15rem}
.actions .btn{min-width:0;padding:0 6px;line-height:1.2}
.row.two{display:grid;grid-template-columns:1fr 1fr}
.tut{position:relative;flex:none;background:var(--sheet);color:var(--ink);
  border:1.5px solid var(--brass);border-radius:14px;padding:10px 14px;font-size:.92rem;line-height:1.45;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.tut[hidden]{display:none}
.tut b.t{display:block;font-family:var(--serif);font-size:1.05rem;margin-bottom:2px;color:var(--brass)}
.tut .err{color:#ff8a7a;display:block;margin-top:4px}
.tut{padding-right:34px}
.tut .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--ink-muted);font-size:1rem;cursor:pointer;padding:6px}
.share-prev{display:block;width:100%;max-width:300px;margin:10px auto 0;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.4)}

/* ===== Стіл «Віяло» (варіант А) ===== */
#myHand{align-items:flex-end;padding-top:16px;padding-bottom:10px}
#myHand .card{margin-left:calc(var(--cw)*-.16);touch-action:none;transition:translate .235s cubic-bezier(.2,.8,.2,1),box-shadow .235s ease,filter .2s ease}
#myHand .card:first-child{margin-left:0}
#myHand .card.dim{filter:brightness(.55) saturate(.6)}
#myHand .card.ok{box-shadow:0 0 0 2px rgba(127,176,105,.95),0 6px 14px rgba(0,0,0,.4)}
#myHand .card.sel{translate:0 -18px;box-shadow:0 0 0 3px var(--brass),0 10px 18px rgba(0,0,0,.35)}
#myHand .card.dragging{opacity:.3}
.drag-ghost{position:fixed;z-index:30;pointer-events:none;margin:0!important;box-shadow:0 16px 30px rgba(0,0,0,.55)!important}
#board4{position:relative}
.cross.drop{outline:2px dashed rgba(127,176,105,.8);outline-offset:6px;border-radius:14px}
.slot4{position:relative;width:var(--c4);height:calc(var(--c4)*1.4);border-radius:calc(var(--c4)*.1);border:1.5px dashed rgba(127,176,105,.85);background:rgba(127,176,105,.1);flex:none}
.slot4 .card{position:absolute;left:-1.5px;top:-1.5px;box-shadow:0 0 0 2px rgba(127,176,105,.95),0 4px 10px rgba(0,0,0,.35)}
.slot4 .card.plain{box-shadow:0 4px 10px rgba(0,0,0,.35)}
.slot4 .card.nobeat{box-shadow:0 0 0 2px var(--red),0 4px 10px rgba(0,0,0,.35);opacity:.8}
/* таймер кільцем довкола аватарки */
.seat4.timed .ava::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(var(--brass) calc(var(--t,1)*360deg),rgba(255,255,255,.14) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.seat4.timed.low .ava::before{background:conic-gradient(var(--red) calc(var(--t,1)*360deg),rgba(255,255,255,.14) 0)}
.seat4.timed .ava{box-shadow:0 0 16px rgba(212,167,58,.45)}
/* остання взятка */
.lastbtn{position:absolute;left:0;bottom:10px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:5px 8px 5px 6px;color:var(--ink-muted);font:500 .72rem var(--sans);cursor:pointer}
.lastbtn[hidden]{display:none}
.lastbtn .card{--w:20px;rotate:-8deg;border-width:2px}
.lastbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.peek{position:fixed;inset:0;z-index:15;background:rgba(10,6,4,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.peek[hidden]{display:none}
.peek-card{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px 18px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.peek-card h3{margin:0 0 10px;font:800 1.2rem var(--serif)}
.peek-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.peek-row>span{width:74px;flex:none;font-size:.82rem;color:var(--ink-muted)}
.peek-row .cards{display:flex;gap:4px;flex-wrap:wrap}
.peek-row .card{--w:40px}
.peek-card p{margin:10px 0 0;font-size:.78rem;color:var(--ink-muted)}
.seatrow .who i[class^="st-"]{font-style:normal;font-size:.74rem;margin-left:6px;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.2);color:var(--ink-muted)}
.seatrow .who i.st-free{color:#9fd08a}
.seatrow .who{display:flex;align-items:center}
.cur{display:flex;align-items:center;gap:12px;border:1.5px solid var(--brass);border-radius:14px;padding:12px 12px 12px 14px;margin:6px 0 4px;background:rgba(212,167,58,.08)}
.cur>div{flex:1;min-width:0}
.cur b{display:block;font-size:1rem}
.cur small{display:block;color:var(--ink-muted);font-size:.82rem;margin-top:2px}
.cur .btn{flex:none;padding:0 16px}
.btn.btn-lg{min-height:58px;font-size:1.06rem}
.linkbtn{background:none;border:0;color:var(--ink-muted);font:500 .86rem var(--sans);padding:8px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.linkbtn.danger{color:#e0786d}
.linkbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
details.opts{margin:2px 0 6px}
details.opts summary{cursor:pointer;color:var(--ink-muted);font-size:.86rem;padding:6px 2px}
details.opts .row{margin-top:8px}
details.rulesbox{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
details.rulesbox summary{cursor:pointer;font-family:var(--serif);font-weight:800;font-size:1.05rem;padding:6px 0}
.seatrow.addbot{width:100%;justify-content:center;background:transparent;border-style:dashed;color:var(--ink-muted);font:600 .92rem var(--sans);cursor:pointer}
.seatrow .who i.st-team{color:var(--brass)}
.gcard{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;display:flex;flex-direction:column;gap:10px;background:rgba(0,0,0,.12)}
.gcard.mine{border-color:var(--brass);background:rgba(212,167,58,.08)}
.gtitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.gtitle b{font-size:1rem}
.gtitle span{font-size:.8rem;color:var(--ink-muted)}
.gseats{display:flex;flex-wrap:wrap;gap:6px}
.gseat{display:inline-flex;align-items:center;gap:2px;padding:4px 10px 4px 4px;border-radius:16px;background:var(--btn);border:1px solid var(--line);font-size:.85rem}
.gseat.me{border-color:var(--brass)}
.gseat.empty{padding:4px 10px;border-style:dashed;background:transparent;color:var(--ink-muted)}
.gbtns{display:flex;gap:8px}
.gbtns .btn{min-height:44px}
.gbtns.col{flex-direction:column}
.gbtns:empty{display:none}
.row.small .btn{min-height:40px;font-size:.86rem}
.muted{color:var(--ink-muted);font-size:.88rem}
.seatrow .who{min-width:0;overflow:hidden}
.seatrow .who>i{font-style:normal;margin-left:8px;color:var(--ink-muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scoretab{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.st-row{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.st-row.me{border-color:rgba(212,167,58,.55)}
.st-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-name small{display:block;color:var(--ink-muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.st-bar i{display:block;height:100%;background:var(--brass)}
.st-row.warn .st-bar i{background:var(--red)}
.st-num{text-align:right;min-width:44px}
.st-num b{display:block;font:800 1.4rem/1 var(--serif);font-variant-numeric:tabular-nums}
.st-num small{color:var(--ink-muted);font-size:.72rem}
.st-row.warn .st-num b{color:#e0786d}
.seat4 .nm4{white-space:nowrap;max-width:88px;overflow:hidden;text-overflow:ellipsis;text-align:center}

body{background:#2a160b var(--tex-frame) center/cover}
#app{gap:8px}

/* шапка: латунні таблички рахунку й дерев'яні ручки */
header.top .sc{border:0;background:linear-gradient(180deg,var(--brass-hi),var(--brass) 48%,#a07a2c);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -1px 0 rgba(0,0,0,.3) inset,0 3px 6px rgba(0,0,0,.45)}
header.top .sc span{color:#5a4120}
header.top .sc b{color:#2b1d0e}
header.top .sc>i{background:rgba(43,29,14,.22)}
header.top .sc>i>i{background:#6b1f2a}
header.top .sc.warn b{color:#8a1d12}
header.top .sc.warn>i>i{background:#b42318}
header.top .sc.us{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 0 var(--us) inset,0 3px 6px rgba(0,0,0,.45)}
header.top .sc.them{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -3px 0 var(--them) inset,0 3px 6px rgba(0,0,0,.45)}
header.top .icon{border:1.5px solid var(--brass-lo);border-radius:50%;color:var(--brass-hi);
  background:radial-gradient(circle at 35% 30%,#5a3a24,#24160d);box-shadow:0 3px 6px rgba(0,0,0,.5)}
header.top .mult{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#2b1d0e}

/* сукно в дерев'яному обідку з тонким золотим кантом */
.board4{background:var(--tex-felt) center/cover;border-radius:24px;padding:10px 8px 10px;margin:2px 0;
  box-shadow:0 0 0 3px #2a150a,0 0 0 5px rgba(243,220,147,.42),0 8px 18px rgba(0,0,0,.45),inset 0 0 44px rgba(0,0,0,.6)}
.board4 .seat4 .nm4{color:var(--tmuted);text-shadow:0 1px 2px rgba(0,0,0,.85)}
.board4 .seat4.active .nm4{color:var(--brass-hi)}
.board4 .ava{color:var(--tink);background:radial-gradient(circle at 35% 30%,#6b4a32,#2a1a10);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.5)}
.board4 .seat4.active .ava{box-shadow:0 0 0 4px var(--brass-hi),0 0 20px rgba(243,220,147,.6)}
.board4 .clock{color:var(--tmuted);text-shadow:0 1px 2px #000}
.board4 .tl{color:var(--brass-hi)}
.seat4.top{margin-left:36px}

/* колода й козир: на 30% більші, козир лежить поперек і видно весь номінал */
.center4{width:132px;height:136px;padding:6px;border:1.5px solid rgba(243,220,147,.5);border-radius:12px;background:rgba(0,0,0,.08)}
.center4 .card{--w:60px}
.center4 .deck{left:6px;top:6px;box-shadow:2px 2px 0 #d8c9a8,4px 4px 0 #bfae88,6px 6px 0 rgba(0,0,0,.35),0 10px 16px rgba(0,0,0,.4)}
.center4 .trumpcard{left:48px;top:6px;box-shadow:0 0 0 2px var(--brass-hi),0 0 16px rgba(243,220,147,.5),0 6px 12px rgba(0,0,0,.4)}
.center4 .trumpcard .idx{font-size:calc(var(--w)*.31)}
.center4 .lbl{left:8px;top:96px;color:var(--tmuted);text-shadow:0 1px 2px #000}
.center4 .lbl b{color:var(--tink)}
.center4 .suitonly{left:20px;top:10px;width:76px;height:76px;font-size:2.6rem;border-color:var(--brass-hi)}

/* купка на столі: шари сходинками в бік того, хто походив; верхній — з латунною рамкою */
.cross{display:grid;grid-template:1fr/1fr;place-items:center;position:relative;min-height:0}
.cross.wide{grid-column:1/4}
.pile{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.prow{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 3px;border-radius:12px}
.prow.last{background:rgba(243,220,147,.10);box-shadow:inset 0 0 0 1px rgba(243,220,147,.35)}
.prow .ptagw{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .66rem var(--sans);color:var(--tink);
  background:radial-gradient(circle at 35% 30%,#6b4a32,#2a1a10);box-shadow:0 0 0 2px rgba(243,220,147,.35)}
.prow .ptagw.us{box-shadow:0 0 0 2px var(--us)}.prow .ptagw.them{box-shadow:0 0 0 2px var(--them)}
.prow.last .ptagw{box-shadow:0 0 0 2px var(--brass-hi),0 0 10px rgba(243,220,147,.5)}
.pile .card.pc{position:relative;--w:var(--pw,64px);margin:0}
.pile .card.pc .idx{font-size:calc(var(--w)*.29)}
.pile .card.pc.top{box-shadow:0 0 0 2.5px var(--brass-hi),0 0 18px rgba(243,220,147,.55),0 8px 16px rgba(0,0,0,.45)}
.pile .card.pc.back{opacity:.95}
.pile .card.pc.back{rotate:0deg}
.pile .card.prev{opacity:.92;box-shadow:0 0 0 2.5px rgba(134,184,109,.95),0 6px 12px rgba(0,0,0,.4)}
.pile .card.prev.nobeat{box-shadow:0 0 0 2.5px var(--red),0 6px 12px rgba(0,0,0,.4);opacity:.75}
.pile .card.prev.plain{box-shadow:0 6px 12px rgba(0,0,0,.4)}
.pile .pslot{position:relative;flex:none;width:var(--pw);height:calc(var(--pw)*1.4);border-radius:calc(var(--pw)*.1);border:1.8px dashed rgba(134,184,109,.9);background:rgba(134,184,109,.1)}

/* шкіряна полиця з рукою, таймером і кнопками */
.rail{position:relative;flex:none;display:flex;flex-direction:column;gap:8px;margin:0 -12px -12px;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;
  background:#5c1a1c var(--tex-leather) center/cover;box-shadow:inset 0 4px 10px rgba(0,0,0,.55),0 -6px 16px rgba(0,0,0,.4)}
.rail::before{content:"";position:absolute;left:16px;right:16px;top:7px;border-top:1.5px dashed rgba(243,220,147,.38);pointer-events:none}
.rail .turnbar{background:rgba(0,0,0,.35)}
.rail .turnbar i{background:linear-gradient(180deg,var(--brass-hi),var(--brass))}
.rail .turnbar span{color:var(--tink);text-shadow:0 1px 2px #000}
.rail .btn{border:0;color:#f6e9cf;background:#5a2d16 var(--tex-frame) center/cover;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 3px 0 #2a150a,0 6px 12px rgba(0,0,0,.45);text-shadow:0 1px 1px #000}
.rail .btn.primary{background:linear-gradient(180deg,var(--brass-hi),var(--brass) 50%,#a07a2c);color:#2b1d0e;text-shadow:none;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 var(--brass-dk),0 6px 12px rgba(0,0,0,.45)}
.rail .btn:disabled{opacity:.55}
.rail .btn.hint{background:radial-gradient(circle at 35% 30%,#5a3a24,#24160d)}
#myHand button.card.wait:not(.sel){filter:brightness(.92)}

/* остання взятка: кнопка в зоні ваших карт */
.rail .lastbtn{position:static;flex:none;width:58px;min-height:50px;padding:2px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border-radius:10px;font:600 .58rem/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--brass-hi);
  background:radial-gradient(circle at 35% 30%,#4a2e1c,#1f120a)}
.rail .lastbtn svg{width:30px;height:30px}
.rail .lastbtn .card{display:none}

/* ===== Розсадка вчотирьох: стіл зверху ===== */
.ptable{position:relative;height:300px;margin:4px 0 2px}
.pfelt{position:absolute;left:50%;top:50%;width:118px;height:118px;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--tex-felt) center/cover;box-shadow:0 0 0 8px #3b200f,0 0 0 10px rgba(243,220,147,.5),0 12px 24px rgba(0,0,0,.5)}
.pfelt span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 .66rem/1.35 var(--sans);color:rgba(243,220,147,.9);letter-spacing:.04em}
.pseat{position:absolute;width:112px;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-50%);text-align:center}
.pseat.b{left:50%;top:84%}.pseat.t{left:50%;top:15%}.pseat.l{left:15%;top:50%}.pseat.r{left:85%;top:50%}
.pava{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font:800 1.15rem var(--serif);color:#f3ead6;
  background:radial-gradient(circle at 35% 30%,#6b4a32,#2a1a10);box-shadow:0 0 0 3px var(--c)}
.pava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pava.us{--c:var(--us)}.pava.them{--c:var(--them)}
.pava.empty{background:rgba(0,0,0,.18);box-shadow:none;border:2px dashed var(--c);color:var(--c);font:400 1.4rem var(--sans)}
.pnm{font-size:.8rem;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptag{font:600 .6rem var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:8px;color:#14100c}
.ptag.us{background:var(--us)}.ptag.them{background:var(--them)}
.psit{border:0;border-radius:9px;padding:6px 10px;font:600 .78rem var(--sans);cursor:pointer;color:#2b1d0e;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 2px 0 var(--brass-dk)}
.plink{background:none;border:0;padding:2px;font:500 .72rem var(--sans);color:var(--ink-muted);text-decoration:underline dotted;cursor:pointer}
.psit:focus-visible,.plink:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.psit:disabled,.plink:disabled{opacity:.5}
/* ===== Стіл А1: суперники в один ряд угорі, усе сукно під карти, пари кольорами ===== */
.board4{position:relative;display:block;padding:0;min-height:300px}
.board4 .center4{position:absolute;left:10px;top:10px;width:130px;height:116px;padding:5px;margin:0}
.board4 .center4 .card{--w:54px}
.board4 .center4 .deck{left:5px;top:5px}
.board4 .center4 .trumpcard{left:61px;top:5px}
.board4 .center4 .lbl{top:auto;bottom:5px;left:7px;font-size:.6rem;line-height:1.2}
.board4 .center4 .lbl b{font-size:.68rem}
.board4 .center4 .lbl .sym{font-size:.85rem}
.board4 .center4 .suitonly{left:23px;top:8px;width:66px;height:66px;font-size:2.2rem}
.board4 .seat4{position:absolute;top:12px;width:72px;margin:0;transform:translateX(-50%);gap:2px}
.board4 .seat4.top{margin:0}
.board4 .seat4 .ava{width:46px;height:46px;font-size:1.15rem}
.board4 .seat4 .nm4{font-size:.7rem;max-width:72px}
.board4 .seat4 .chip{font-size:.6rem;padding:1px 6px}
.board4 .seat4 .chip.hide{display:none}
.board4 .seat4 .tl{position:absolute;top:-6px;left:calc(50% + 22px);font-size:.64rem;white-space:nowrap;padding:1px 5px;border-radius:7px;background:rgba(0,0,0,.45)}
.board4 .seat4 .bubble{top:100%;left:50%;right:auto;translate:-50% 4px;z-index:6}
.board4 .seat4.left .bubble{left:0;translate:0 4px}
.board4 .seat4.right .bubble{left:auto;right:0;translate:0 4px}
.board4 .clock{position:absolute;right:12px;bottom:5px;padding:0;font-size:.7rem}
.board4 .cross,.board4 .cross.wide{position:absolute;left:6px;right:6px;top:134px;bottom:22px;display:grid;place-items:center}
/* пари в грі 2 на 2: наша зелена, їхня червона — як таблички МИ / ВОНИ */
.board4 .seat4.tu{--tc:var(--us)} .board4 .seat4.tt{--tc:var(--them)}
.board4 .seat4.tu .ava,.board4 .seat4.tt .ava{box-shadow:0 0 0 3.5px var(--tc),0 6px 12px rgba(0,0,0,.5)}
.board4 .seat4.tu.active .ava,.board4 .seat4.tt.active .ava{box-shadow:0 0 0 3.5px var(--tc),0 0 0 7px var(--brass-hi),0 0 18px rgba(243,220,147,.6)}
.board4 .seat4 .tpill{white-space:nowrap;font:700 .56rem/1.35 var(--sans);letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:7px;color:#14100c;background:var(--tc)}
@media (max-width:385px){.board4 .seat4 .tpill .tpx{display:none}}
.prow.tu,.prow.tt{border-left:4px solid transparent;padding-left:5px}
.prow.tu{border-left-color:var(--us);background:linear-gradient(90deg,rgba(134,184,109,.16),transparent 70%)}
.prow.tt{border-left-color:var(--them);background:linear-gradient(90deg,rgba(216,112,90,.16),transparent 70%)}
.prow.tu.last,.prow.tt.last{box-shadow:inset 0 0 0 1px rgba(243,220,147,.45)}
.prow.tu .ptagw.us,.prow.tt .ptagw.them{color:#14100c;box-shadow:none}
.prow.tu .ptagw.us{background:var(--us)}.prow.tt .ptagw.them{background:var(--them)}
.prow.tu.last .ptagw,.prow.tt.last .ptagw{box-shadow:0 0 0 2px var(--brass-hi),0 0 10px rgba(243,220,147,.5)}
/* великий номінал на картах столу: цифра й масть у куті, щоб читалося і на малих картах */
.pile .card.pc:not(.back) .idx{left:7%;top:3%;font-size:calc(var(--w)*.40);line-height:.86}
.pile .card.pc:not(.back) .idx i{font-size:.8em}
.pile .card.pc:not(.back) .idx.b{display:none}
.pile .card.pc:not(.back) .pip{inset:auto 7% 3% auto;display:block;font-size:calc(var(--w)*.5);line-height:1}

</style>
</head>

<script>
const $ = id => document.getElementById(id);
const L = Engine;
// Рівень ботів один — «Робот» (сильний рівень)
const LEVEL_NAME = { slava: 'Робот' };
const G = { mode: 2, level: 'slava', ser: null, deal: null,
  goal: 12,
  rng: L.mulberry32((Date.now() ^ (Math.random() * 1e9)) >>> 0),
  sel: new Set(), busy: false, pending: '', notes: [], prompt: '', started: false, timer: null, chips: {}, fly: -1,
  net: { ws: null, me: null, room: null, names: null, lastSeq: -1, shown: null, join: null, retry: 0, queue: [], sent: false } };
try {
  const md = +localStorage.getItem('kozel-mode'); if (md >= 2 && md <= 4) G.mode = md;
  const gl = +localStorage.getItem('kozel-goal'); if (gl === 6 || gl === 12) G.goal = gl;
} catch (e) {}

const NAMES = { 2: [null, { nom: 'Робот', gen: 'Робота' }], 3: [null, { nom: 'Кум', gen: 'Кума' }, { nom: 'Робот', gen: 'Робота' }],
  4: [null, { nom: 'Кум', gen: 'Кума' }, { nom: 'Брат', gen: 'Брата' }, { nom: 'Робот', gen: 'Робота' }] };
const MODE_NAME = { 2: 'На двох', 3: 'На трьох', 4: 'Пара на пару' };
const isMate = p => n_() === 4 && p === 2;
const n_ = () => G.deal ? G.deal.n : (G.net.room ? Math.max(1, G.net.room.n) : G.mode);
G.level = 'slava';
const nm = p => p === 0 ? 'Ви' : (G.net.room ? (G.net.names[p] || '') : NAMES[n_()][p].nom);
const gen = p => G.net.room ? nm(p) : NAMES[n_()][p].gen;
const esc = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const cardsWord = n => n + ' ' + plural(n, 'карту', 'карти', 'карт');
const labels = cs => cs.map(L.cardLabel).join(' ');
function sortHand(h, trump) {
  return h.slice().sort((a, b) => {
    const ta = L.suitOf(a) === trump, tb = L.suitOf(b) === trump;
    if (ta !== tb) return ta ? 1 : -1;
    if (L.suitOf(a) !== L.suitOf(b)) return L.suitOf(a) - L.suitOf(b);
    return L.rankOf(a) - L.rankOf(b);
  });
}
// Колода без точного числа
function stockWord(k, n) {
  const f = k / (36 - 4 * n);
  if (k === 0) return 'ніц';
  if (f > 0.72) return 'майже повна';
  if (f >= 0.5) return 'половина';
  if (f >= 0.2) return 'менше половини';
  return 'зовсім мало';
}

function cardEl(c, opts = {}) {
  const el = document.createElement(opts.button ? 'button' : 'div');
  el.className = 'card' + (opts.cls ? ' ' + opts.cls : '');
  if (c === null || c === undefined) { el.className += ' back'; return el; }
  const s = L.suitOf(c), r = L.RANK_LABEL[L.rankOf(c)], sym = L.SUIT_SYM[s];
  if (s >= 2) el.className += ' red';
  if (G.deal && s === G.deal.trump) el.className += ' trump';
  el.innerHTML = `<span class="idx">${r}<i>${sym}</i></span><span class="pip">${sym}</span><span class="idx b">${r}<i>${sym}</i></span>`;
  el.setAttribute('aria-label', r + ' ' + L.SUIT_NAME[s] + (G.deal && s === G.deal.trump ? ', козир' : ''));
  return el;
}

// ---------- Рендер ----------
function renderCore() {
  const s = G.deal, ser = G.ser, n = n_();
  const sc = $('score'); sc.innerHTML = '';
  document.body.classList.toggle('crowded', !!G.net.room && n === 3);
  // Рахунок: однакові плитки — коротка мітка (ВИ, ДС, КУМ), штрафні великою цифрою, смужка «до козла»
  const goal = ser ? ser.goal : G.goal || 12;
  const labels = n === 4 ? ['МИ', 'ВОНИ'] : [...Array(n).keys()].map(i => mono(nm(i)));
  const full = n === 4 ? ['Наша пара', 'Суперники'] : [...Array(n).keys()].map(i => nm(i));
  labels.forEach((t, i) => {
    const pen = ser ? ser.penalties[i] : 0, pct = Math.min(100, Math.round(100 * pen / goal));
    const d = document.createElement('div');
    d.className = 'sc' + (i === 0 ? ' me' : '') + (n === 4 ? (i === 0 ? ' us' : ' them') : '') + (pen >= goal - 3 && pen > 0 ? ' warn' : '');
    d.title = `${full[i]}: ${pen} з ${goal}`;
    d.innerHTML = `<span>${esc(t)}</span><b>${pen}</b><i><i style="width:${pct}%"></i></i>`;
    sc.appendChild(d);
  });
  sc.setAttribute('aria-label', 'Рахунок: ' + labels.map((t, i) => `${full[i]} ${ser ? ser.penalties[i] : 0}`).join(', ') + ` з ${goal}`);
  $('mult').hidden = !ser || ser.mult === 1;
  $('mult').textContent = '×' + (ser ? ser.mult : 1);
  $('levelLbl').textContent = G.net.room ? `${MODE_NAME[n]}, стіл ${G.net.room.code}` : MODE_NAME[n] + ', гра з роботом';
  $('msg').textContent = [G.pending, ...G.notes, G.prompt].filter(Boolean).join(' ');
  document.body.classList.add('m4');
  $('board4').hidden = false;
  if (!s) {
    for (const id of ['seatT', 'seatL', 'seatR', 'pile', 'center4', 'myHand', 'actions']) $(id).innerHTML = '';
    return;
  }
  const actor = L.toAct(s);
  renderBoard(s, actor);

  const opp = $('opp'); opp.innerHTML = ''; opp.classList.toggle('four', n === 4);
  for (let p = 1; p < n; p++) {
    const seat = document.createElement('div');
    const pos = p === n - 1 && n > 2 ? ' right' : (n === 4 && p === 2 ? ' center' : '');
    seat.className = 'seat' + pos + (actor === p ? ' active' : '');
    seat.innerHTML = `<div class="nm">${nm(p)}${isMate(p) ? ' <em>партнер</em>' : ''}${actor === p && G.busy ? ' думає…' : ''}</div>`;
    const h = document.createElement('div'); h.className = 'hand';
    for (let i = 0; i < s.hands[p].length; i++) h.appendChild(cardEl(null, { cls: 'sm' }));
    seat.appendChild(h); opp.appendChild(seat);
  }
  $('trumpInfo').innerHTML = `Козир: <b>${L.SUIT_SYM[s.trump]} ${L.SUIT_NAME[s.trump]}</b>`;

  const st = $('stock'); st.innerHTML = '';
  if (s.stock.length) {
    st.appendChild(cardEl(s.trumpCard, { cls: 'trumpcard' }));
    if (s.stock.length > 1) st.appendChild(cardEl(null, { cls: 'deck' }));
  } else {
    const d = document.createElement('div'); d.className = 'suitonly';
    d.style.color = s.trump >= 2 ? 'var(--red)' : 'var(--ink)';
    d.textContent = L.SUIT_SYM[s.trump]; st.appendChild(d);
  }
  const cnt = document.createElement('div'); cnt.className = 'cnt';
  cnt.innerHTML = 'колода<br>' + stockWord(s.stock.length, n);
  st.appendChild(cnt);

  const tb = $('table'); tb.innerHTML = '';
  if (s.table) {
    const t = s.table;
    t.attack.forEach((c, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot' + (t.layers.length > 2 ? ' deeper' : t.layers.length > 1 ? ' deep' : '');
      slot.appendChild(cardEl(c, { cls: 'tbl' + (t.layers.length === 0 ? ' new' : '') }));
      t.layers.forEach((l, j) => {
        const cls = 'tbl l' + (j + 1) + (j === t.layers.length - 1 ? ' new' : '');
        slot.appendChild(cardEl(l.type === 'cover' ? l.cards[i] : null, { cls }));
      });
      tb.appendChild(slot);
    });
  }

  const mh = $('myHand'); mh.innerHTML = '';
  const myTurn = !G.busy && actor === 0 && (s.phase === 'attack' || s.phase === 'defend') && !G.net.sent;
  // карти можна вибирати й наперед, поки ходять інші — на своєму ході лишиться натиснути кнопку
  const canPick = !G.net.sent && !G.undoSnap && (s.phase === 'attack' || s.phase === 'defend' || s.phase === 'intercept');
  const hints = handHints(s, myTurn);
  const hs = sortHand(s.hands[0], s.trump), k = hs.length, mid = (k - 1) / 2, step = k > 5 ? 5 : 7;
  for (const [i, c] of hs.entries()) {
    const el = cardEl(c, { button: true });
    // віяло: карти трохи повернуті й лежать дугою
    el.style.rotate = ((i - mid) * step) + 'deg';
    el.style.top = (Math.pow(Math.abs(i - mid), 2) * 3) + 'px';
    el.style.zIndex = i + 1;
    if (hints.ok.has(c)) el.classList.add('ok');
    if (hints.dim.has(c)) el.classList.add('dim');
    if (G.sel.has(c)) el.classList.add('sel');
    el.setAttribute('aria-pressed', G.sel.has(c));
    el.disabled = !canPick;
    if (!myTurn) el.classList.add('wait');
    el.dataset.c = 'c' + c;
    el.onclick = () => {
      if (Drag.justDropped) return;
      if (G.sel.has(c)) G.sel.delete(c); else G.sel.add(c);
      haptic.tap();
      renderCore();
    };
    if (myTurn) el.onpointerdown = e => Drag.start(e, c, el);
    mh.appendChild(el);
  }
  renderActions(actor === 0 && !G.busy);
}

// ---------- Стіл «хрестом» (усі режими) ----------
// Місце кожного гравця: T — угорі, L — ліворуч, R — праворуч, B — ви внизу; fly — куди летить взятка
const POS = {
  2: [{ at: 'B', fly: 0 }, { at: 'T', fly: 2 }],
  3: [{ at: 'B', fly: 0 }, { at: 'L', fly: 1 }, { at: 'R', fly: 3 }],
  4: [{ at: 'B', fly: 0 }, { at: 'L', fly: 1 }, { at: 'T', fly: 2 }, { at: 'R', fly: 3 }],
};
// Фото профілю Telegram (онлайн); якщо не завантажилось — лишається літера
function avaImg(p) {
  const url = G.net.room && G.net.room.avas ? G.net.room.avas[p] : null;
  return url ? `<img src="${url}" alt="" loading="lazy" onerror="this.remove()">` : '';
}
const LETTER = { 'Робот': 'Р', 'Дядя Слава': 'Р', 'Кум': 'К', 'Сват': 'С', 'Брат': 'Б' };
function renderBoard(s, actor) {
  const n = s.n, pos = POS[n];
  for (const at of ['T', 'L', 'R']) {
    const seat = $('seat' + at);
    const p = pos.findIndex(x => x.at === at);
    seat.className = 'seat4 ' + { T: 'top', L: 'left', R: 'right' }[at] + (p < 0 ? ' empty' : '') +
      (p > 0 && isMate(p) ? ' mate' : '') + (p > 0 && actor === p ? ' active' : '') + (n === 4 && p > 0 ? (isMate(p) ? ' tu' : ' tt') : '');
    // усі суперники в один ряд угорі (зліва направо за ходом гри), праворуч від колоди
    const row = pos.filter(x => x.at !== 'B').map(x => x.at), ri = row.indexOf(at);
    seat.style.left = ri < 0 ? '' : `calc(144px + (100% - 150px) * ${(ri + 0.5) / row.length})`;
    if (p < 0) { seat.innerHTML = ''; continue; }
    const chip = G.chips[p];
    const nmp = esc(nm(p)), letter = LETTER[nm(p)] || esc((nm(p)[0] || '?').toUpperCase());
    const off = G.net.room && G.net.room.online && !G.net.room.online[p];
    const ch = off ? (G.net.room.auto && G.net.room.auto[p] ? '🤖 грає бот' : 'нема зв’язку') : chip;
    seat.innerHTML = `<div class="ava" aria-label="${nmp}">${letter}${avaImg(p)}<span class="cnt4">${s.hands[p].length}</span></div>` +
      `<div class="nm4">${nmp.length > 12 ? nmp.slice(0, 11) + '…' : nmp}</div>` +
      (n === 4 ? `<span class="tpill">${isMate(p) ? 'ми<span class="tpx"> · партнер</span>' : 'вони'}</span>` : '') + `<div class="chip${ch === 'взятка' ? ' win' : ''}${ch ? '' : ' hide'}">${ch || '·'}</div>`;
    if (actor === p && turnRemainMs() !== null) { seat.classList.add('timed'); seat.insertAdjacentHTML('beforeend', '<div class="tl" data-tl></div>'); }
    const bb = Chat.bubbles[p];
    if (bb && bb.until > Date.now()) seat.insertAdjacentHTML('beforeend', `<div class="bubble">${esc(bb.text)}</div>`);
  }
  renderPile(s, actor);
  const c4 = $('center4'); c4.innerHTML = '';
  if (s.stock.length) {
    c4.appendChild(cardEl(s.trumpCard, { cls: 'trumpcard' }));
    if (s.stock.length > 1) c4.appendChild(cardEl(null, { cls: 'deck' }));
  } else {
    const d = document.createElement('div'); d.className = 'suitonly';
    d.style.color = s.trump >= 2 ? 'var(--red)' : 'var(--tink)'; d.textContent = L.SUIT_SYM[s.trump]; c4.appendChild(d);
  }
  // Підпис: масть козиря великим символом + скільки лишилось у колоді
  const lb = document.createElement('div'); lb.className = 'lbl';
  const col = s.trump >= 2 ? '#ff6b5a' : 'var(--tink)';
  lb.innerHTML = `<b>козир <span class="sym" style="color:${col}">${L.SUIT_SYM[s.trump]}</span> ${L.SUIT_NAME[s.trump]}</b><br>колода: ${stockWord(s.stock.length, n)}`;
  c4.appendChild(lb);
}

const LAST_ICON = `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="9" width="17" height="23" rx="3" transform="rotate(-12 15 20)" fill="#6b1f2a" stroke="#f3e8d2" stroke-width="2"/><rect x="15" y="7" width="17" height="23" rx="3" transform="rotate(8 23 18)" fill="#6b1f2a" stroke="#f3e8d2" stroke-width="2"/><path d="M27 34 a7 7 0 1 0 -6 -9" fill="none" stroke="#f3dc93" stroke-width="2.6" stroke-linecap="round"/><path d="M18 22 l3 4 l4 -3" fill="none" stroke="#f3dc93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>взятка</span>`;
// ---------- Карти на столі: кожен хід — окремий рядок, нічого не накладається ----------
// Вгорі атака, під нею відповіді по черзі; кожна карта стоїть точно під тією, яку б'є.
// Ліворуч від рядка — літера гравця, останній хід — з латунною рамкою.
function renderPile(s, actor) {
  const box = $('pile'); box.innerHTML = '';
  const t = s.table, n = s.n;
  $('cross').className = 'cross' + (n === 2 ? ' wide' : '');
  if (!t) return;
  const rows = [{ p: t.by, cards: t.attack.map(c => ({ c, back: false })) }];
  for (const l of t.layers) rows.push({ p: l.p, cards: l.cards.map(c => ({ c, back: l.type === 'discard' })) });
  const preview = s.phase === 'defend' && actor === 0 && !G.busy && !G.net.sent && G.sel.size
    ? pairSel(t.top, [...G.sel], s.trump) : null;
  if (preview) rows.push({ p: 0, preview: true, cards: preview.map(x => x ? { c: x.c, ok: x.ok } : null) });
  const k = t.attack.length, R = rows.length;
  // розмір карти: найбільший, за якого всі рядки влазять на сукно
  const cr = $('cross').getBoundingClientRect();
  const tagW = 26, gap = 6, rgap = 8;
  const W = Math.max(140, cr.width - 6), H = Math.max(120, cr.height - 6);
  const w = Math.max(34, Math.min(80, Math.floor((W - tagW - gap - (k - 1) * gap) / k), Math.floor((H - (R - 1) * rgap) / (R * 1.4))));
  box.style.setProperty('--pw', w + 'px');
  box.style.width = box.style.height = '';
  const topOwner = t.topBy === null ? t.by : t.topBy;
  const lastRow = R - 1 - (preview ? 1 : 0);
  rows.forEach((r, ri) => {
    const row = document.createElement('div');
    row.className = 'prow' + (ri === lastRow ? ' last' : '') + (r.preview ? ' prev' : '') + (n === 4 ? (r.p % 2 === 0 ? ' tu' : ' tt') : '');
    const who = r.p === 0 ? 'Ви' : nm(r.p);
    const tag = document.createElement('span');
    tag.className = 'ptagw' + (n === 4 ? (r.p % 2 === 0 ? ' us' : ' them') : (r.p === 0 ? ' us' : ''));
    tag.textContent = r.p === 0 ? 'Ви' : (LETTER[who] || (who[0] || '?').toUpperCase());
    tag.title = who;
    row.appendChild(tag);
    r.cards.forEach((e, i) => {
      if (!e) { const sl = document.createElement('div'); sl.className = 'pslot'; row.appendChild(sl); return; }
      const el = cardEl(e.back ? null : e.c);
      el.classList.add('pc');
      if (r.preview) el.classList.add('prev', !hintsOn() ? 'plain' : e.ok ? 'okp' : 'nobeat');
      else {
        el.dataset.c = e.back && r.p !== 0 ? 'h' + r.p + '_' + ri + '_' + i : 'c' + e.c;
        el.dataset.o = r.p;
        if (ri === lastRow && r.p === topOwner && s.phase !== 'resolve' && !e.back) el.classList.add('top');
      }
      row.appendChild(el);
    });
    box.appendChild(row);
  });
}

function renderActions(mine) {
  const box = $('actions'); box.innerHTML = '';
  const s = G.deal;
  const mk = (txt, fn, enabled, primary) => {
    const b = document.createElement('button'); b.className = 'btn' + (primary ? ' primary' : '');
    b.textContent = txt; b.disabled = !enabled; b.onclick = fn; box.appendChild(b); return b;
  };
  const ltr = G.net.room ? G.net.room.lastTrick : G.lastTrick;
  if (ltr) {
    const lb = document.createElement('button');
    lb.className = 'btn lastbtn'; lb.id = 'lastBtn'; lb.title = 'Остання взятка';
    lb.setAttribute('aria-label', 'Остання взятка');
    lb.innerHTML = LAST_ICON;
    lb.onclick = () => showLastTrick(ltr);
    box.appendChild(lb);
  }
  if (G.undoSnap && !G.net.room) { mk('↶ Скасувати хід', doUndo, true); return; }
  if (!mine || s.phase === 'resolve' || s.phase === 'dealEnd') {
    const a = L.toAct(s);
    const pre = G.sel.size && s.phase !== 'resolve' && s.phase !== 'dealEnd';
    mk(pre ? `Вибрано ${cardsWord(G.sel.size)} · чекаємо вашого ходу` : G.busy && a > 0 ? nm(a) + ' думає…' : 'Зачекайте', null, false); return;
  }
  const sel = [...G.sel];
  if (!G.net.room && hintsOn() && !(s.phase === 'defend' && L.canIntercept(s))) { const hb = mk('💡', doHint, true); hb.classList.add('hint'); hb.setAttribute('aria-label', 'Підказка'); hb.title = 'Підказка'; }
  if (s.phase === 'attack') {
    const ok = sel.length > 0 && L.isUniform(sel);
    mk(sel.length > 1 ? 'Походити ' + cardsWord(sel.length) : 'Походити', () => act({ type: 'attack', cards: sel }), ok, true);
    return;
  }
  if (s.phase === 'intercept') {
    mk(`Перехопити ${s.hands[0].length} картами`, () => act({ type: 'intercept' }), true, true);
    mk('Не перехоплювати', () => act({ type: 'pass' }), true);
    return;
  }
  const n = s.table.top.length;
  const full = sel.length === n;
  const inter = L.canIntercept(s);
  if (inter) mk(`Перехопити ${s.hands[0].length} картами`, () => act({ type: 'intercept' }), true, true);
  const covers = L.legalActions(s).filter(x => x.type === 'cover');
  // Побити нічим і скидати доведеться всю руку: одна кнопка, без вибору карт
  if (!covers.length && s.hands[0].length === n) {
    mk('Скинути', () => act({ type: 'discard', cards: s.hands[0].slice() }), true, !inter);
    return;
  }
  // «Побити» — лише якщо вибрані карти входять хоча б в один варіант бою
  const beatOk = covers.some(c => sel.every(x => c.cards.includes(x)));
  const discOk = sel.length <= n;
  if (beatOk) mk('Побити', () => act({ type: 'cover', cards: sel }), full && L.canCover(s.table.top, sel, s.trump), !inter);
  if (discOk) mk('Скинути', () => act({ type: 'discard', cards: sel }), full, !beatOk && !inter);
  if (!beatOk && !discOk) mk('Забагато карт: потрібно ' + n, null, false);
}

// ---------- Анімація (FLIP): карти плавно їдуть зі старого місця на нове ----------
const motionOK = () => !window.matchMedia || !matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.2,.8,.2,1)';
// Швидкість руху карт: 1 — початкова; 0.85 — на 15% повільніше
const SPEEDS = { slow: 0.65, normal: 0.85, fast: 1.2 };
const dur = ms => Math.round(ms / (SPEEDS[G.set.speed] || 0.85));
function seatAva(p) {
  if (!G.deal || p === 0) return null;
  const at = POS[G.deal.n][p].at;
  return document.querySelector('#seat' + at + ' .ava');
}
const centerOf = r => [r.left + r.width / 2, r.top + r.height / 2];
function snapshot() {
  const m = new Map();
  document.querySelectorAll('[data-c]').forEach(el => m.set(el.dataset.c, el.getBoundingClientRect()));
  return m;
}
function playFlip(before) {
  const deckEl = $('center4'), deck = deckEl && deckEl.getBoundingClientRect();
  let fresh = 0;
  document.querySelectorAll('[data-c]').forEach(el => {
    const now = el.getBoundingClientRect();
    if (!now.width) return;
    let from = before.get(el.dataset.c), opacity = 1, delay = 0, scale;
    if (from) {
      scale = from.width / now.width;
    } else {
      // нова карта: у руку — з колоди, на стіл — від аватара того, хто зіграв
      if (el.closest('#myHand')) from = deck;
      else { const a = seatAva(+el.dataset.o); if (!a) return; from = a.getBoundingClientRect(); opacity = 0; }
      if (!from) return;
      scale = 0.45; delay = fresh++ * dur(70);
    }
    const [fx, fy] = centerOf(from), [nx, ny] = centerOf(now);
    const dx = fx - nx, dy = fy - ny;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(scale - 1) < 0.02) return;
    el.animate([
      { transform: `translate(${dx}px, ${dy}px) scale(${scale})`, opacity },
      { transform: 'none', opacity: 1 },
    ], { duration: dur(420), delay, easing: EASE, fill: 'backwards' });
  });
}
function render() {
  const before = motionOK() ? snapshot() : null;
  renderCore();
  if (before) playFlip(before);
}
// Взятка з'їжджає до того, хто її забрав
function collectTo(w) {
  Sfx.play('collect');
  if (!motionOK()) return;
  const target = w === 0 ? $('myHand') : seatAva(w);
  if (!target) return;
  const [tx, ty] = centerOf(target.getBoundingClientRect());
  document.querySelectorAll('#pile .card').forEach((el, i) => {
    const [cx, cy] = centerOf(el.getBoundingClientRect());
    el.animate([
      { transform: 'none', opacity: 1 },
      { transform: `translate(${tx - cx}px, ${ty - cy}px) scale(.35)`, opacity: 0 },
    ], { duration: dur(480), delay: i * dur(25), easing: 'cubic-bezier(.55,0,.75,.4)', fill: 'forwards' });
  });
}

// ---------- Хід гри ----------
function later(fn, ms) { clearTimeout(G.timer); G.timer = setTimeout(fn, ms); }
function act(a) {
  if (G.busy || L.toAct(G.deal) !== 0) return;
  if (G.tut && !Tut.check(a)) return;
  G.turnLeft = null;
  haptic.act();
  if (G.net.room) { // онлайн: хід перевіряє сервер
    if (G.net.sent) return;
    if ((G.net.room.away || []).length) { renderPause(G.net.room); toast('Гру зупинено: чекаємо, поки гравець повернеться'); return; }
    G.net.sent = true; G.sel.clear();
    const msg = { t: 'act', id: Math.random().toString(36).slice(2, 10), a: { type: a.type, cards: a.cards } };
    G.net.pendingAct = { msg, ts: Date.now(), sentAt: Date.now() };
    netSend(msg);
    render(); return;
  }
  G.undoSnap = !G.tut && G.set.undo !== false
    ? { deal: L.packState(L.cloneState(G.deal)), notes: G.notes.slice(), chips: { ...G.chips }, pending: G.pending, prompt: G.prompt } : null;
  perform(0, a);
}
// Скасувати свій хід (гра з ботами): поки бот не відповів
const UNDO_MS = 1800;
function doUndo() {
  const u = G.undoSnap; if (!u) return;
  clearTimeout(G.timer);
  G.undoSnap = null;
  G.deal = L.unpackState(u.deal); G.notes = u.notes; G.chips = u.chips; G.pending = u.pending; G.prompt = u.prompt;
  G.sel.clear(); G.busy = false;
  haptic.tap(); saveGame(); step();
}

function perform(p, a) {
  const s = G.deal;
  G.prompt = '';
  if (p === 0) G.sel.clear();
  else if (a.type === 'intercept') G.sel = new Set([...G.sel].filter(c => s.hands[0].includes(c)));
  Sfx.forAction(a, s.trump);
  if (a.type === 'intercept' && p === 0 && !G.tut) localStat(st => Stats.onIntercept(st));
  if (a.type === 'attack') G.chips = { [p]: 'ходить' };
  else if (a.type === 'intercept') G.chips = { [p]: 'перехопив' };
  else if (a.type === 'cover') G.chips[p] = "б'є";
  else if (a.type === 'discard') G.chips[p] = 'скинув';
  if (a.type === 'attack') {
    L.applyAction(s, a);
    G.notes = [p === 0 ? `Ви пішли: ${labels(a.cards)}.` : `${nm(p)} ходить: ${labels(a.cards)}.`];
  } else if (a.type === 'pass') {
    L.applyAction(s, a);
    if (p === 0) G.notes.push('Ви не перехоплюєте.');
  } else if (a.type === 'intercept') {
    const back = s.table.attack.slice(), from = s.table.by;
    L.applyAction(s, a);
    G.pending = '';
    G.notes = [(p === 0 ? 'Ви перехопили хід: ' : `${nm(p)} перехоплює хід: `) + labels(s.table.attack) + '.',
      from === 0 ? `Ваші ${labels(back)} повернулися в руку.` : `Карти ${gen(from)} ${labels(back)} повернулися ${from === p ? '' : 'йому '}в руку.`];
  } else {
    L.applyAction(s, a);
    G.pending = '';
    if (a.type === 'cover') G.notes.push(p === 0 ? `Ви б'єте: ${labels(s.table.top)}.` : `${nm(p)} б'є: ${labels(s.table.top)}.`);
    else G.notes.push(p === 0 ? `Ви скинули ${cardsWord(a.cards.length)}.` : `${nm(p)} скидає ${cardsWord(a.cards.length)}.`);
  }
  render();
  saveGame();
  later(step, p === 0 ? (G.undoSnap ? UNDO_MS : 350) : 500);
}

function promptMe() {
  const s = G.deal;
  if (s.phase === 'attack') { G.prompt = 'Ваш хід: одна карта або кілька однієї масті чи одного номіналу.'; return; }
  if (s.phase === 'intercept') { G.prompt = `У вас ${s.hands[0].length === 3 ? 'три' : 'чотири'} карти однієї масті чи номіналу. Перехопити хід?`; return; }
  const t = s.table, k = t.top.length;
  const owner = t.topBy === null ? t.by : t.topBy;
  const canBeat = L.legalActions(s).some(x => x.type === 'cover');
  if (isMate(owner)) G.prompt = `Старші зараз карти Брата. ${canBeat ? 'Можна перебити або скинути' : 'Скиньте'} ${cardsWord(k)}.`;
  else G.prompt = canBeat ? `Побийте ${k === 1 ? 'карту' : 'карти'} ${gen(owner)} або скиньте ${cardsWord(k)}.` : `Побити нічим, скиньте ${cardsWord(k)}.`;
  if (L.canIntercept(s)) G.prompt += ` Або перехопіть хід ${s.hands[0].length === 3 ? 'трьома' : 'чотирма'} картами.`;
}

function step() {
  const s = G.deal;
  if (G.undoSnap) { G.undoSnap = null; }
  if (s.phase === 'dealEnd') { G.busy = false; render(); return endDeal(); }
  if (s.phase === 'resolve') {
    const w = L.trickWinner(s);
    const res = w === 0 ? 'Взятка ваша.' : isMate(w) ? 'Взятку забирає Брат, вона наша.' : `Взятку забирає ${n_() === 2 ? 'бот' : nm(w)}.`;
    G.notes.push(res); G.prompt = '';
    {
      G.chips = { [w]: 'взятка' }; render();
      if (w === 0 || isMate(w)) haptic.good();
      later(() => {
        collectTo(w);
        later(() => { if (G.tut) return Tut.done(); G.lastTrick = captureTrick(s); L.finishTrick(s); G.notes = []; G.pending = res; render(); saveGame(); later(step, 150); }, dur(560));
      }, 850);
      return;
    }
    render();
    later(() => { L.finishTrick(s); G.notes = []; G.pending = res; render(); later(step, 250); }, 1400);
    return;
  }
  const p = L.toAct(s);
  if (p !== 0) {
    G.busy = true; G.prompt = ''; render();
    later(() => { const a = G.tut ? Tut.botAction(s) : AI.chooseAction(s, G.level, G.rng); G.busy = false; perform(p, a); }, 550);
  } else { G.busy = false; G.turnLeft = G.set.timer && !G.tut ? TURN_MS : null; G.warned = false; promptMe(); render(); }
}

function startSeries() {
  G.gameStart = Date.now(); G.turnLeft = null;
  if (G.net.room) { netSend({ t: 'leave' }); G.net.room = null; }
  tgGuard(true);
  try { localStorage.setItem('kozel-mode', G.mode); localStorage.setItem('kozel-goal', G.goal); } catch (e) {}
  clearTimeout(G.timer);
  G.tut = null; Tut.show();
  G.seriesMode = G.mode;
  G.ser = L.newSeries(G.mode, G.goal); G.started = true; closeSheet(); startDeal(true);
}
function startDeal(first) {
  G.dealEndOpen = false;
  const s = L.newDeal(G.rng, G.ser.n, first, G.ser.nextStarter);
  G.lastTrick = null;
  G.deal = s; G.sel.clear(); G.notes = []; G.prompt = ''; G.chips = {}; G.fly = -1; G.turnLeft = null;
  G.chips = { [s.attacker]: 'перший' };
  const who = s.attacker === 0 ? 'Ви ходите першим' : `Першим ходить ${nm(s.attacker).toLowerCase() === 'бот' ? 'бот' : nm(s.attacker)}`;
  let t = `Роздача ${G.ser.dealNo + 1}. Козир ${L.SUIT_SYM[s.trump]} ${L.SUIT_NAME[s.trump]}. `;
  if (first) {
    if (s.trumpChanges) t += 'Козирів ні в кого не було, тому козир замінено. ';
    t += who + ' (найменший козир).';
  } else t += who + ' (наступний після того, хто взяв останню взятку).';
  if (G.ser.mult > 1) t += ` Штрафи в цій роздачі ×${G.ser.mult}.`;
  G.pending = t; render();
  saveGame();
  later(step, 1400);
}

function endDeal() {
  const s = G.deal, ser = G.ser;
  const res = L.dealResult(s, ser.mult);
  const rec = L.applyDealToSeries(ser, res, s.lastTrick);
  localStat(st => Stats.onDeal(st, Stats.dealFacts(res, ser.n, 0)));
  if (ser.over) localStat(st => Stats.onSeries(st, { lost: Stats.seriesLost(ser, 0), milk: ser.milk }));
  if (ser.over) clearSave(); else saveGame(true);
  render();
  showDealEnd(res, rec, ser, s.piles.map(pile => pile.map(e => [e.c, e.hidden ? 1 : 0])), s.trump);
}
// Підсумок роздачі (офлайн і онлайн). Індекс 0 — це завжди ви (або ваша команда).
function showDealEnd(res, rec, ser, reveal, trump) {
  const n = ser.n, on = !!G.net.room;
  const penWord = k => k + ' ' + plural(k, 'штрафне', 'штрафні', 'штрафних');
  const why = b => b === 4 ? 'ані очка' : b === 2 ? 'до 30 очок' : 'менше 60 очок';
  const pen = k => k + ' ' + plural(k, 'штрафне очко', 'штрафні очки', 'штрафних очок');
  let h = '';

    h += `<h2>${res.eggs ? 'Яйця!' : res.loser === 0 ? 'Роздачу програно' : 'Роздачу виграно'}</h2>`;

    else h += `<p>${res.loser === 0 ? 'Ви отримуєте' : esc(nm(1)) + ' отримує'} ${pen(res.penalty)} (${why(res.base)}${rec.mult > 1 ? ', ×' + rec.mult + ' за яйця' : ''}).</p>`;
    h += `<div class="tally"><div>Ваші очки<b>${ser.penalties[0]}</b></div><div>${esc(nm(1))}<b>${ser.penalties[1]}</b></div></div>`;
  } else if (n === 4) {
    h += `<h2>${res.eggs ? 'Яйця!' : res.loser === 0 ? 'Роздачу програно' : 'Роздачу виграно'}</h2>`;
    h += `<div class="big">${res.teamPts[0]}<span>ми : вони</span>${res.teamPts[1]}</div>`;
    h += `<p>Ви ${res.pts[0]}, ${esc(nm(2))} ${res.pts[2]}; ${esc(nm(1))} ${res.pts[1]}, ${esc(nm(3))} ${res.pts[3]}.</p>`;
    if (res.eggs) h += `<p>Рівно 60 на 60. Грається додаткова роздача, штрафи в ній для програвших ×${ser.mult}.</p>`;
    else h += `<p>${res.loser === 0 ? 'Наша команда отримує' : 'Команда суперників отримує'} ${pen(res.penalty)} (${why(res.base)}${rec.mult > 1 ? ', ×' + rec.mult + ' за яйця' : ''}).</p>`;
    h += `<div class="tally"><div>Наші очки<b>${ser.penalties[0]}</b></div><div>Їхні очки<b>${ser.penalties[1]}</b></div></div>`;
  } else {
    h += `<h2>${res.pens[0] === 0 ? 'Роздачу виграно' : 'Роздачу програно'}</h2>`;
    h += `<table class="res"><tr><th></th><th>Набрано</th><th>Штраф</th><th>Усього</th></tr>`;
    for (let i = 0; i < n; i++)
      h += `<tr><td>${esc(nm(i))}</td><td><b>${res.pts[i]}</b></td><td>${res.pens[i] ? '+' + res.pens[i] : '—'}</td><td>${ser.penalties[i]}</td></tr>`;
    h += `</table><p>Перемагає найбільша сума. Решта: менше 60 очок — 1 штрафне, до 30 — 2, нуль — 4.</p>`;
  }
  const over = ser.over;
  let losers = [];
  if (over) {
    if (!on) tgGuard(false);
    const lost = n === 4 ? ser.loser === 0 : ser.losers.includes(0); lost ? haptic.bad() : haptic.good();
    losers = n === 4 ? (ser.loser === 0 ? [0, 2] : [1, 3]) : ser.losers.slice();
    let title;
    if (n === 4) title = (ser.loser === 0 ? 'Ми ' : 'Вони ') + (ser.milk ? 'молочні козли' : 'козли') + ': ' + losers.map(x => esc(nm(x))).join(' і ');
    else {
      const ls = ser.losers, goat = ser.milk ? 'молочний козел' : 'козел', many = ser.milk ? 'молочні козли' : 'козли';
      if (ls.includes(0)) title = ls.length > 1 ? `Ви і ${esc(nm(ls.find(x => x)))}: ${many}` : `Ви ${goat}`;
      else title = ls.map(x => esc(nm(x))).join(' і ') + (ls.length > 1 ? ': ' + many : ' ' + goat);
    }
    h += `<h2 style="margin-top:18px">${title}</h2><p>${ser.milk ? (n === 3 ? 'У когось 6 штрафних, а в когось нуль' : '6 штрафних проти нуля') + ': найгірший програш, гру закінчено достроково.' : `${ser.goal} ${plural(ser.goal, 'штрафне очко', 'штрафні очки', 'штрафних очок')}, гру закінчено.`}</p>`;
    if (n === 3) {
      const order = [0, 1, 2].sort((a, b) => ser.penalties[a] - ser.penalties[b]);
      h += '<ol class="places">' + order.map(i => `<li>${esc(nm(i))}: ${penWord(ser.penalties[i])}</li>`).join('') + '</ol>';
    }
    // на трьох: двоє, що лишилися, можуть дограти до фіналу вдвох
    // дограти вдвох можна, лише якщо в обох, хто лишився, менше 12 штрафних
    const survivorsOk = ser.penalties.every((v, i) => ser.losers.includes(i) || v < ser.goal);
    const canDuo = n === 3 && ser.losers.length === 1 && !ser.losers.includes(0) && survivorsOk && (!on || G.net.room.canDuo);
    h += `<div class="stack">`;
    if (canDuo) h += `<button class="btn primary" id="duoBtn">Дограти вдвох до фіналу</button>`;
    if (on) h += `<button class="btn${canDuo ? '' : ' primary'}" id="next">Ще партію</button>`;
    else h += `<button class="btn${canDuo ? '' : ' primary'}" id="rematch">Ще партію</button>`;
    h += `<button class="btn" id="shareBtn">Поділитися результатом</button>`;
    h += on ? `<button class="btn" id="leaveBtn">Вийти з гри</button>` : `<button class="btn" id="again">Головне меню</button>`;
    h += `</div>`;
  } else {
    h += `<div class="stack"><button class="btn primary" id="next">${on ? 'Далі' : 'Наступна роздача'}</button>` +
      `<button class="btn" id="exitBtn">У головне меню</button></div>`;
  }
  h += revealHtml(reveal, n, trump);
  const openIt = () => {
    openSheet(h, 'dealEnd');
    if ($('rematch')) $('rematch').onclick = () => { G.mode = G.seriesMode || G.mode; startSeries(); };
    if ($('shareBtn')) $('shareBtn').onclick = () => Share.result(ser, losers);
    if ($('exitBtn')) $('exitBtn').onclick = () => openMenu(true); // гра лишається, повернутися можна з меню
    if ($('again')) $('again').onclick = openMenu;
    if ($('leaveBtn')) $('leaveBtn').onclick = () => { netSend({ t: 'leave' }); };
    if ($('duoBtn')) $('duoBtn').onclick = () => {
      if (G.net.room) { netSend({ t: 'duo' }); $('duoBtn').disabled = true; $('duoBtn').textContent = 'Чекаємо на згоду суперника…'; }
      else startDuo(ser);
    };
    if ($('next')) {
      $('next').focus();
      $('next').onclick = on
        ? () => { netSend({ t: 'ready' }); $('next').disabled = true; $('next').textContent = 'Чекаємо інших…'; }
        : () => { closeSheet(); startDeal(false); };
    }
  };
  G.lastDealEnd = openIt; G.dealEndOpen = true;
  if (over) goatShow(ser, losers, openIt); else openIt();
}

// Дограти вдвох (гра з ботами): козел вибуває, двоє інших продовжують зі своїми штрафними
function startDuo(ser) {
  const keep = [0, 1, 2].filter(i => !ser.losers.includes(i));
  closeSheet();
  G.mode = 2;
  G.ser = L.newSeries(2, ser.goal);
  G.ser.penalties = keep.map(i => ser.penalties[i]);
  G.chips = {}; G.turnLeft = null;
  toast('Граємо вдвох до фіналу. Штрафні очки перенесено.');
  startDeal(true);
}

const tgv = v => TG && TG.isVersionAtLeast && TG.isVersionAtLeast(v);
